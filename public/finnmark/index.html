<title>Finnmarkspanelet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
/* ── Tokens ──────────────────────────────────────────────────────────────
   Identitet: Finnmark Arbeiderparti. Ap-rød er merkefargen for grensesnittet;
   nøytralene har en svak varm bias mot den, slik at gråtonene leses som valgt.
   Seriefargene for kommuner er den validerte kategoripaletten og holdes bevisst
   utenfor merkefargen — en kommunelinje skal aldri kunne forveksles med «Ap».
   ⚠️ Ap-rødtonene under bør bekreftes mot partiets grafiske profil.
   ───────────────────────────────────────────────────────────────────────── */
:root {
  color-scheme: light;

  --plane:        #f7f4f4;
  --surface:      #fefcfc;
  --surface-2:    #f1ebec;
  --ink:          #191113;
  --ink-2:        #5a4c4e;
  --ink-muted:    #8a7a7c;
  --grid:         #eae2e3;
  --axis:         #cfc3c4;
  --rule:         rgba(25, 17, 19, 0.10);
  --rule-strong:  rgba(25, 17, 19, 0.18);

  --accent:       #e8112d;   /* Ap-rød: flater, aktive tilstander, fokus */
  --accent-text:  #b80a20;   /* mørkere variant der tekstkontrast må holde */
  --accent-soft:  #fde8ea;
  --accent-ink:   #ffffff;

  --warn:         #fab219;
  --warn-ink:     #6b4a00;
  --warn-soft:    #fdf3dc;

  /* Kategoripalett — validert sett, lyse steg */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;

  /* Ekstra partifarger for mandatfordelingen — regionale lister utenfor de
     åtte faste (Nordkalottfolket, Samelista, INP m.fl.). Validert sammen med
     s1–s8 og accent via dataviz-skillets validate_palette.js. */
  --p-nordk: #0891b2; --p-same: #c026d3; --p-inp: #92400e; --p-mdg: #16a34a;

  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --r: 3px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:        #120e0f;
    --surface:      #1c1718;
    --surface-2:    #251f20;
    --ink:          #f7f2f2;
    --ink-2:        #bfb2b3;
    --ink-muted:    #8a7a7c;
    --grid:         #2b2425;
    --axis:         #453a3c;
    --rule:         rgba(247, 242, 242, 0.11);
    --rule-strong:  rgba(247, 242, 242, 0.20);

    --accent:       #ff4f63;
    --accent-text:  #ff8090;
    --accent-soft:  #3a1418;
    --accent-ink:   #1c1718;

    --warn:         #fab219;
    --warn-ink:     #fdd77a;
    --warn-soft:    #2a2110;

    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;

    --p-nordk: #1592a3; --p-same: #d946ef; --p-inp: #b45309; --p-mdg: #16a34a;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:        #120e0f;
  --surface:      #1c1718;
  --surface-2:    #251f20;
  --ink:          #f7f2f2;
  --ink-2:        #bfb2b3;
  --ink-muted:    #8a7a7c;
  --grid:         #2b2425;
  --axis:         #453a3c;
  --rule:         rgba(247, 242, 242, 0.11);
  --rule-strong:  rgba(247, 242, 242, 0.20);

  --accent:       #ff4f63;
  --accent-text:  #ff8090;
  --accent-soft:  #3a1418;
  --accent-ink:   #1c1718;

  --warn:         #fab219;
  --warn-ink:     #fdd77a;
  --warn-soft:    #2a2110;

  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;

  --p-nordk: #1592a3; --p-same: #d946ef; --p-inp: #b45309; --p-mdg: #16a34a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
.masthead {
  padding: 14px 20px 14px;
  background: var(--surface);
  border-top: 3px solid var(--accent);
  border-bottom: 1px solid var(--rule);
}
.masthead .eyebrow {
  display: block;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--accent-text);
  margin-bottom: 3px;
}
.masthead .titlerow {
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
.masthead h1 {
  margin: 0;
  font-size: 19px; font-weight: 600; letter-spacing: -0.015em;
}
.masthead .sub {
  color: var(--ink-muted); font-size: 13px;
}

/* ── Control rail ───────────────────────────────────────────────────────── */
.rail {
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
  padding: 14px 20px 16px;
  display: flex; flex-direction: column; gap: 14px;
}
.rail-row { display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-start; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field > label, .field-label {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--ink-muted);
}

.chips { display: flex; flex-wrap: wrap; gap: 5px; max-width: 780px; }
.chip {
  font: inherit; font-size: 12.5px;
  padding: 3px 9px;
  border: 1px solid var(--rule-strong);
  border-radius: var(--r);
  background: transparent; color: var(--ink-2);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .12s, border-color .12s, color .12s;
}
.chip:hover { background: var(--surface-2); color: var(--ink); }
.chip[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--ink);
  font-weight: 500;
}
.chip .swatch {
  width: 9px; height: 9px; border-radius: 2px; flex: none;
  background: var(--sw, transparent);
  box-shadow: 0 0 0 1px var(--surface);
}
.chip[aria-pressed="false"] .swatch { opacity: 0; }
.chip.is-total[aria-pressed="true"] { border-color: var(--ink); }
.chip.is-total .swatch { background: var(--ink); border-radius: 1px; height: 3px; width: 12px; }
.chip:disabled { opacity: .38; cursor: not-allowed; }

.mini-actions { display: flex; gap: 10px; margin-top: 2px; }
.linkish {
  font: inherit; font-size: 12px; background: none; border: none; padding: 0;
  color: var(--accent-text); cursor: pointer; text-decoration: underline;
  text-underline-offset: 2px;
}

select, .seg {
  font: inherit; font-size: 13px;
  border: 1px solid var(--rule-strong); border-radius: var(--r);
  background: var(--surface); color: var(--ink);
  padding: 4px 8px;
}
.seg { display: inline-flex; padding: 2px; gap: 2px; }
.seg button {
  font: inherit; font-size: 12.5px;
  border: none; background: none; color: var(--ink-2);
  padding: 3px 10px; border-radius: 2px; cursor: pointer;
}
.seg button[aria-pressed="true"] {
  background: var(--accent); color: var(--accent-ink); font-weight: 500;
}
.seg button:disabled { opacity: .35; cursor: not-allowed; }

.years { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; }
.years input[type="range"] { width: 128px; accent-color: var(--accent); }
.year-num {
  width: 64px; font: inherit; font-family: var(--mono); font-size: 13px;
  border: 1px solid var(--rule-strong); border-radius: var(--r);
  background: var(--surface); color: var(--ink); padding: 2px 4px; text-align: center;
}

.cap-note {
  font-size: 12px; color: var(--ink-muted); max-width: 420px;
}

/* ── Tabs ───────────────────────────────────────────────────────────────── */
.tabs {
  display: flex; gap: 2px; padding: 0 20px;
  background: var(--surface); border-bottom: 1px solid var(--rule);
  overflow-x: auto;
}
.tabs button {
  font: inherit; font-size: 13.5px;
  background: none; border: none; cursor: pointer;
  color: var(--ink-2); padding: 11px 13px 9px;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] {
  color: var(--ink); font-weight: 600; border-bottom-color: var(--accent);
}

.sharebar {
  display: flex; justify-content: flex-end; align-items: center; gap: 10px;
  padding: 9px 20px 0; min-height: 34px;
}
.sharebar button {
  font: inherit; font-size: 12px; color: var(--accent-text);
  background: var(--surface); border: 1px solid var(--rule-strong);
  border-radius: var(--r); padding: 6px 10px; cursor: pointer;
}
.sharebar button:hover { background: var(--surface-2); }
.sharebar .share-status { color: var(--ink-muted); font-size: 12px; }

/* ── Content ────────────────────────────────────────────────────────────── */
main { padding: 18px 20px 56px; display: grid; gap: 16px; }
.panel { display: none; gap: 16px; }
.panel[data-active] { display: grid; }

.split { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(240px, 1fr); gap: 16px; }
@media (max-width: 940px) { .split { grid-template-columns: 1fr; } }

.card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  padding: 14px 16px 16px;
  min-width: 0;
}
.card-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 2px;
}
.card h2 {
  margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em;
  text-wrap: balance;
}
.card .unit { font-size: 12px; color: var(--ink-muted); font-family: var(--mono); }
.card .desc { margin: 4px 0 12px; font-size: 12.5px; color: var(--ink-2); max-width: 62ch; }

.source {
  margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--grid);
  font-family: var(--mono); font-size: 11px; color: var(--ink-muted);
  display: flex; gap: 14px; flex-wrap: wrap;
}
.source a {
  color: var(--accent-text);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.source a:hover { color: var(--ink); }
.source .source-link {
  color: var(--accent-text);
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* ── Legend ─────────────────────────────────────────────────────────────── */
.legend {
  display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 2px;
  font-size: 12px; color: var(--ink-2);
}
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.legend .key { width: 12px; height: 3px; border-radius: 2px; background: var(--k); flex: none; }
.legend .key.total { height: 3px; background: var(--ink); }
.legend .key.comparison {
  width: 16px; height: 0; border-radius: 0; background: none;
  border-top: 2px dashed var(--k);
}

/* ── Chart ──────────────────────────────────────────────────────────────── */
.chart-wrap { position: relative; }
svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
svg.chart text { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-muted); }
svg.chart .gridline { stroke: var(--grid); stroke-width: 1; }
svg.chart .axisline { stroke: var(--axis); stroke-width: 1; }
svg.chart .serie { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.chart .serie.comparison { stroke-width: 1.8; opacity: .82; }
svg.chart .serie-total { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
svg.chart .endlabel { font-size: 10.5px; font-weight: 500; }
svg.chart .crosshair { stroke: var(--ink-muted); stroke-width: 1; stroke-dasharray: 2 3; }
svg.chart .dot { stroke: var(--surface); stroke-width: 2; }
svg.chart .scatter-pt { stroke: var(--surface); stroke-width: 1.5; }
svg.chart .ptlabel { font-size: 10px; fill: var(--ink-2); }
svg.chart .seglabel {
  fill: var(--ink); font-weight: 600;
  stroke: var(--surface); stroke-width: 2.2; paint-order: stroke fill;
}

.tooltip {
  position: absolute; pointer-events: none; z-index: 5;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--rule-strong); border-radius: var(--r);
  padding: 8px 10px; font-size: 12px; min-width: 148px;
  box-shadow: 0 6px 18px rgba(0,0,0,.13);
  opacity: 0; transition: opacity .1s;
}
.tooltip[data-show] { opacity: 1; }
.tooltip .tt-head {
  font-family: var(--mono); font-size: 11px; color: var(--ink-muted);
  margin-bottom: 5px; letter-spacing: .04em;
}
.tooltip .tt-row {
  display: flex; align-items: center; gap: 7px;
  justify-content: space-between; padding: 1.5px 0;
}
.tooltip .tt-name { display: inline-flex; align-items: center; gap: 6px; }
.tooltip .tt-key { width: 8px; height: 8px; border-radius: 2px; background: var(--k); flex: none; }
.tooltip .tt-val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; }

/* ── Stat tiles ─────────────────────────────────────────────────────────── */
.tiles { display: grid; gap: 9px; }
.tile {
  border: 1px solid var(--rule); border-radius: var(--r);
  padding: 9px 11px; background: var(--surface);
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
}
.tile .t-name { font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.tile .t-name .key { width: 10px; height: 3px; border-radius: 2px; background: var(--k); flex: none; }
.tile .t-name .key.comparison {
  width: 14px; height: 0; border-radius: 0; background: none;
  border-top: 2px dashed var(--k);
}
.tile .t-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .t-val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 13.5px; white-space: nowrap; }
.tile .t-delta { font-family: var(--mono); font-size: 11.5px; margin-left: 7px; }
.up   { color: #006300; }
.down { color: #b4322f; }
:root[data-theme="dark"] .up   { color: #0ca30c; }
:root[data-theme="dark"] .down { color: #e66767; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .up   { color: #0ca30c; }
  :root:not([data-theme="light"]) .down { color: #e66767; }
}

/* ── Table ──────────────────────────────────────────────────────────────── */
.table-scroll { overflow-x: auto; margin-top: 2px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td {
  text-align: right; padding: 5px 9px;
  border-bottom: 1px solid var(--grid); white-space: nowrap;
}
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
thead th {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  color: var(--ink-muted); border-bottom: 1px solid var(--axis);
  position: sticky; top: 0; background: var(--surface);
}
tbody td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tbody td:first-child { font-family: var(--sans); }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.total-row td { font-weight: 600; border-bottom: 1px solid var(--axis); }
.muni-key { display: inline-flex; align-items: center; gap: 7px; }
.muni-key .key { width: 10px; height: 3px; border-radius: 2px; background: var(--k); flex: none; }
.sami { color: var(--ink-muted); font-size: 11.5px; }

details.tableview { margin-top: 12px; }
details.tableview > summary {
  cursor: pointer; font-size: 12.5px; color: var(--accent-text);
  list-style: none; display: inline-flex; align-items: center; gap: 6px;
}
details.tableview > summary::-webkit-details-marker { display: none; }
details.tableview > summary::before { content: "▸"; font-size: 10px; }
details.tableview[open] > summary::before { content: "▾"; }

.empty {
  padding: 34px 16px; text-align: center; color: var(--ink-muted); font-size: 13px;
}

.pill {
  display: inline-block; font-family: var(--mono); font-size: 10.5px;
  padding: 1px 6px; border-radius: 2px;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--rule);
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<header class="masthead">
  <span class="eyebrow">Finnmark Arbeiderparti</span>
  <div class="titlerow">
    <h1>Finnmarkspanelet</h1>

</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Temaer"></nav>

<div class="sharebar" aria-label="Del visning">

<div class="rail">
  <div class="rail-row">
    <div class="field" style="flex:1 1 460px; min-width:0;">
      <span class="field-label" id="lbl-regions">Regioner</span>
      <div class="chips" id="regionChips" role="group" aria-labelledby="lbl-regions"></div>
      <div class="mini-actions">

        <input type="number" id="yrTo" class="year-num" aria-label="Til år (skriv inn)">

</div>

<main id="main"></main>



<div id="lasteskjerm" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--muted);font:14px system-ui;z-index:999;">
  Henter tall fra SSB …
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════════
   0. DATAKILDE
   Siden henter LIVE fra /api/ssb/<tema> ved hvert besøk. Det endepunktet
   validerer, cacher og faller tilbake til siste gode uttrekk på tjener-
   siden — se lib/ssb/index.ts. Her på klienten er reglene enklere:
   svarer et tema ikke, vises det uten data. Siden bruker aldri syntetiske
   tall som erstatning for et manglende eller feilet uttrekk.

   Ekte data følger INDIKATOR, ikke tema. Ett uttrekk kan dekke folkemengde og
   aldersandeler uten å dekke flytting — de kommer fra ulike SSB-tabeller. Å
   markere hele temaet som ekte da ville vært en løgn om to av kurvene.
   ═════════════════════════════════════════════════════════════════════════ */
const SSB_TEMAER = ["befolkning", "naering", "okonomi", "valg"];
const SSB_FETCH_TIMEOUT_MS = 20000;

async function fetchWithTimeout(input, init = {}, timeoutMs = SSB_FETCH_TIMEOUT_MS) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(input, { ...init, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

/* Kommuneøkonomi skal kun vises for innloggede — se «FANER» lenger ned der
   selve fanen skjules. Vi lar rett og slett være å SPØRRE om temaet for
   anonyme besøkende her, i stedet for å hente det og skjule feilen: en
   mislykket 401 ville ellers dukket opp i feilPerTema/LIVE_FEIL-banneret
   under, som en falsk «henting feilet»-advarsel ingen kan gjøre noe med. */
async function hentLiveSSB(temaer = SSB_TEMAER) {
  const ut = {};
  const feilPerTema = {};
  await Promise.all(temaer.map(async (tema) => {
    try {
      const res = await fetchWithTimeout(`/api/ssb/${tema}`, { cache: "no-store" });
      if (!res.ok) { feilPerTema[tema] = `HTTP ${res.status}`; return; }
      const svar = await res.json();
      if (!svar?.datasett) { feilPerTema[tema] = "uventet svarform"; return; }
      ut[tema] = { ...svar.datasett, _status: svar.status, _feil: svar.feil ?? null };
      if (svar.status !== "fersk") {
        console.warn(`[ssb:${tema}] status=${svar.status}`, svar.feil ?? "");
      }
    } catch (e) {
      feilPerTema[tema] = e instanceof Error ? e.message : String(e);
    }
  }));
  return { ut, feilPerTema };
}

/* Kommuneøkonomi-fanen var tidligere skjult for besøkende uten innlogging i
   TinkrFlows. Den skjulingen var kosmetikk: /api/ssb/[tema] har ingen
   autorisasjon, så de samme tallene lå åpent på /api/ssb/okonomi uansett.
   Dette nettstedet har ingen innlogging i det hele tatt, så fanen vises nå
   til alle — den later ikke lenger som den er en tilgangskontroll.

   Skal fanen bort, sett denne til false. Da forsvinner både fanen og
   hentingen av temaet, for alle. */
const VIS_KOMMUNEOKONOMI = true;

/* Selve programmet pakkes i en async-start fordi vi må VENTE på nettverket
   før noe kan tegnes — hele resten av filen forutsetter at SSB allerede er
   fylt. Bygges siden om til et rammeverk med egen loading-tilstand senere,
   er det denne funksjonen som blir overflødig. */
async function start() {
  const temaer = VIS_KOMMUNEOKONOMI ? SSB_TEMAER : SSB_TEMAER.filter((t) => t !== "okonomi");
  const { ut: live } = await hentLiveSSB(temaer);
  const SSB = live;
  document.getElementById("lasteskjerm")?.remove();

const EKTE_HENTET = new Map();   // indikator → ISO-tidspunkt
for (const blokk of Object.values(SSB)) {
  for (const rad of blokk?.fakta ?? []) {
    if (blokk.hentet) EKTE_HENTET.set(rad[2], blokk.hentet);
  }
}
/* Aldersstruktur og valg trenger egne tidspunkt siden de ikke ligger i
   den flate faktatabellen. */
for (const b of Object.values(SSB)) {
  if (b?.befolkning?.length && b.hentet) EKTE_HENTET.set("__struktur", b.hentet);
}
if (SSB.valg?.resultater?.length && SSB.valg.hentet) EKTE_HENTET.set("__valg", SSB.valg.hentet);

/** Hentetidspunkt for en indikator, formatert for kildelinja under figuren. */
function hentet(ind) {
  const t = EKTE_HENTET.get(ind);
  if (!t) return "—";
  const d = new Date(t);
  return Number.isNaN(+d)
    ? String(t)
    : d.toLocaleDateString("nb-NO", { day: "numeric", month: "short", year: "numeric" });
}

/* ═══════════════════════════════════════════════════════════════════════════
   3. EKTE DATA
   Alle faktarader og valgresultater kommer fra SSB/valgresultat.no via SSB-laget.
   Manglende publiserte år vises ikke som nuller eller syntetiske erstatninger.
   ═══════════════════════════════════════════════════════════════════════════ */
const YEAR_MIN = 2015, YEAR_MAX = new Date().getUTCFullYear();
const FACTS = [];
const VALGFAKTA = [];

 /* Aldersstruktur fra ekte SSB-data. Tidligere demobygging er fjernet;
    denne indeksen inneholder derfor bare rader som faktisk kom fra SSB. */
const POPSTRUCT = new Map();
for (const blokk of Object.values(SSB)) {
  for (const [region, ar, kjonn, band, antall] of blokk?.befolkning ?? []) {
    if (!REGION_BY_KEY[region]) continue;
    POPSTRUCT.set(`${region}|${ar}|${kjonn}|${band}`, antall);
  }
}

const AGE_REFERENCE_DATA = new Map();
for (const blokk of Object.values(SSB)) {
  for (const [referanse, ar, band, antall] of blokk?.sammenligninger ?? []) {
    AGE_REFERENCE_DATA.set(`${referanse}|${ar}|${band}`, antall);
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   4. OPPSLAG OG AGGREGERING
   ═══════════════════════════════════════════════════════════════════════════ */
const FACT_INDEX = new Map();
for (const f of FACTS) FACT_INDEX.set(`${f.region}|${f.ar}|${f.indikator}`, f.verdi);

/* Ekte rader legges inn etter demoradene. De kan ikke kollidere — push()
   hopper over indikatorer som finnes her — men rekkefølgen gjør intensjonen
   entydig hvis noen senere fjerner den sperren. */
for (const blokk of Object.values(SSB)) {
  for (const [region, ar, indikator, verdi] of blokk?.fakta ?? []) {
    if (!REGION_BY_KEY[region] || !IND[indikator]) continue;
    FACT_INDEX.set(`${region}|${ar}|${indikator}`, verdi);
  }
}

/* Ekte valgresultater, samme "ekte overstyrer demo"-prinsipp som over — men
   som egen oppslagstabell, siden VALGFAKTA er formet ulikt FACT_INDEX
   (valgtype er en fjerde nøkkel, ikke en indikator). */
const VALG_EKTE = new Map();   // "valgtype|region|år|parti" → andel
for (const blokk of Object.values(SSB)) {
  for (const [valgtype, region, ar, parti, andel] of blokk?.resultater ?? []) {
    if (!REGION_BY_KEY[region]) continue;
    VALG_EKTE.set(`${valgtype}|${region}|${ar}|${parti}`, andel);
  }
}
function valgAndel(valgtype, region, ar, parti) {
  return VALG_EKTE.get(`${valgtype}|${region}|${ar}|${parti}`) ?? null;
}

/* Finnmark samlet er folketallsvektet snitt av kommunene, samme prinsipp
   som resten av panelet bruker for regionaggregering (se finnmark()) — men
   valgAndel() har valgtype som egen dimensjon, så aggregeringen kan ikke
   gjenbruke finnmark() direkte. Brukes av både stolpediagrammet og
   trendlinjen, for alle tre valgtyper likt. */
function valgAndelAggregert(valgtype, region, ar, parti) {
  if (region !== TOTAL_KEY) return valgAndel(valgtype, region, ar, parti);
  let num = 0, den = 0;
  for (const r of REGIONS) {
    const a = valgAndel(valgtype, r.key, ar, parti);
    const w = FACT_INDEX.get(`${r.key}|${Math.min(ar, YEAR_MAX)}|folkemengde`) ?? 0;
    if (a !== null) { num += a * w; den += w; }
  }
  return den ? +(num / den).toFixed(1) : null;
}

/* ── Mandatfordeling: fylkesnivå, ALLE partier som fikk mandater — ikke bare
   de åtte i PARTIER. Egen oppslagstabell fra samme "ekte overstyrer
   demo"-prinsipp, nøkkel er valgtype|år|partikode (ingen region — mandater
   fordeles på hele fylket/valgdistriktet). */
const MANDAT_EKTE = new Map();   // "valgtype|år|partikode" → { navn, mandater }
for (const blokk of Object.values(SSB)) {
  for (const [valgtype, ar, partikode, partinavn, mandater] of blokk?.mandater ?? []) {
    MANDAT_EKTE.set(`${valgtype}|${ar}|${partikode}`, { navn: partinavn, mandater });
  }
}

/** Mandatfordeling for én valgtype × år — bare hvis kilden har ekte data. */
function mandaterFor(valgtype, ar) {
  return [...MANDAT_EKTE.entries()]
    .filter(([k]) => k.startsWith(`${valgtype}|${ar}|`))
    .map(([k, v]) => ({ kode: k.split("|")[2], navn: v.navn, mandater: v.mandater }));
}

/* Årene ekte data faktisk dekker. Uttrekket kan være kortere enn demoperioden,
   og da skal tidsvelgeren ikke tilby år vi ikke har tall for. */
const EKTE_ÅR = (() => {
  const år = new Set();
  for (const blokk of Object.values(SSB)) {
    for (const a of blokk?.aar ?? []) år.add(Number(a));
  }
  return [...år].sort((a, b) => a - b);
})();

/* ── Befolkningsstruktur: region × år × kjønn × aldersgruppe ──────────────
   Dette er bevisst en EGEN faktatabell, ikke presset inn i den flate
   indikatormodellen. Alder og kjønn er to ekte dimensjoner, og SSB leverer
   dem som dimensjoner i samme tabell (07459) — å kode dem som «indikator»
   ville gjort SSB-mappingen verre, ikke bedre.                              */
const AGE_BANDS = (() => {
  const b = [];
  for (let a = 0; a < 90; a += 5) b.push({ key: `${a}_${a + 4}`, navn: `${a}–${a + 4}`, lo: a });
  b.push({ key: "90p", navn: "90+", lo: 90 });
  return b;
})();

function pop(region, ar, kjonn, band) {
  if (region === TOTAL_KEY) {
    return REGIONS.reduce((s, r) => s + (POPSTRUCT.get(`${r.key}|${ar}|${kjonn}|${band}`) ?? 0), 0);
  }
  return POPSTRUCT.get(`${region}|${ar}|${kjonn}|${band}`) ?? 0;
}
const popBand  = (region, ar, band) => pop(region, ar, "m", band) + pop(region, ar, "k", band);
const popTotal = (region, ar) => AGE_BANDS.reduce((s, b) => s + popBand(region, ar, b.key), 0);

/* Aldersfilter for tidsserien. Pyramiden er upåvirket — den ER
   aldersfordelingen, og skal alltid vise alle grupper. */
/** Kompakt sammendrag av utvalget: sammenhengende bånd slås til intervaller. */
function selectedAgeLabel() {
  const chosen = AGE_BANDS.filter(b => state.ageBands.includes(b.key));
  const runs = [];
  for (const b of chosen) {
    const last = runs[runs.length - 1];
    if (last && b.lo === last.end.lo + 5) last.end = b;
    else runs.push({ start: b, end: b });
  }
  return runs.map(r => {
    if (r.start === r.end) return r.start.navn;
    const hi = r.end.key === "90p" ? "90+" : String(r.end.lo + 4);
    return `${r.start.lo}–${hi}`;
  }).join(", ");
}


function raw(region, ar, ind) {
  if (region === TOTAL_KEY) return finnmark(ar, ind);
  const v = FACT_INDEX.get(`${region}|${ar}|${ind}`);
  return v === undefined ? null : v;
}

const totalCache = new Map();
function finnmark(ar, ind) {
  const ck = `${ar}|${ind}`;
  if (totalCache.has(ck)) return totalCache.get(ck);
  const meta = IND[ind];
  let out;
  if (meta.additiv) {
    // Summen av ingenting er ikke null — det er ukjent. Uten dette skillet
    // ville år uten data vist «0 innbyggere i Finnmark».
    let sum = 0, treff = 0;
    for (const r of REGIONS) {
      const v = FACT_INDEX.get(`${r.key}|${ar}|${ind}`);
      if (v != null) { sum += v; treff++; }
    }
    out = treff ? sum : null;
  } else {
    // Ikke-additive indikatorer må vektes med folketall, ikke snittes flatt.
    let num = 0, den = 0;
    for (const r of REGIONS) {
      const v = FACT_INDEX.get(`${r.key}|${ar}|${ind}`);
      const w = FACT_INDEX.get(`${r.key}|${ar}|folkemengde`) ?? 0;
      if (v != null) { num += v * w; den += w; }
    }
    out = den ? +(num / den).toFixed(IND[ind].dec) : null;
  }
  totalCache.set(ck, out);
  return out;
}

function popOf(region, ar) {
  return region === TOTAL_KEY ? finnmark(ar, "folkemengde") : (FACT_INDEX.get(`${region}|${ar}|folkemengde`) ?? null);
}

/** Verdi etter valgt måleform. */
function value(region, ar, ind, norm, baseYear) {
  const v = raw(region, ar, ind);
  if (v == null) return null;
  if (norm === "per1000" && per1000Allowed(ind)) {
    const p = popOf(region, ar);
    return p ? +(v / p * 1000).toFixed(1) : null;
  }
  if (norm === "index") {
    const b = raw(region, baseYear, ind);
    return b ? +(v / b * 100).toFixed(1) : null;
  }
  return v;
}

function per1000Allowed(ind) {
  /* Folkemengde vises alltid som aldersgrupper i tidsserien, og en kohort
     per 1 000 innbyggere er et meningsfylt forholdstall. */
  return ind === "folkemengde" ? true : IND[ind].per1000;
}
function effectiveNorm(ind, norm) {
  if (norm === "per1000" && !per1000Allowed(ind)) return "abs";
  return norm;
}

function unitFor(ind, norm) {
  const n = effectiveNorm(ind, norm);
  if (n === "index") return `indeks, ${state.from} = 100`;
  if (n === "per1000") return ind === "folkemengde"
    ? "personer per 1 000 innb."
    : "per 1 000 innb.";
  return IND[ind].enhet;
}

const nf = (v, dec) => v == null ? "–" :
  v.toLocaleString("nb-NO", { minimumFractionDigits: dec, maximumFractionDigits: dec });

function fmt(v, ind, norm) {
  const n = effectiveNorm(ind, norm);
  if (v == null) return "–";
  if (n === "index") return nf(v, 1);
  if (n === "per1000") return nf(v, 1);
  return nf(v, IND[ind].dec);
}

/* ═══════════════════════════════════════════════════════════════════════════
   5. TILSTAND — delt på tvers av alle faner
   ═════════════════════════════════════════════════════════════════════════ */
const MAX_SERIES = 8;
const SLOTS = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];

const state = {
  tab: "befolkning",
  selected: ["alta", "sorvaranger", "hammerfest", "vadso"],
  showTotal: false,
  from: 2015,          /* siste 10 år som utgangspunkt */
  to: 2024,
  visAlleAr: false,    /* tvinger x-aksen til å vise hvert år, uansett periodelengde */
  norm: "abs",
  befView: "struktur", /* "tidsserie" | "struktur" */
  pyrRegion: TOTAL_KEY,
  pyrMode: "antall",   /* "antall" | "prosent" */
  ageBands: ["20_24", "25_29", "30_34", "35_39"],
  ageReferences: ["norge"],
  ind: { befolkning: "folkemengde", okonomi: "driftsresultat", naering: "arbeidsplasser" },
  valgtype: "kommune",
  valgRegion: TOTAL_KEY,
  valgVisning: "oppslutning",  /* "oppslutning" | "mandater" | "utvikling" */
  hemiValgtype: "storting",
  hemiYear: 2025,
  trendPartier: ["ap", "h"],   /* de to største — flere kan slås på i kontrollraden */
  trendTyper: ["kommune"],     /* flere valgtyper kan overlegges, se "2 prikkformer"-krav */
  scatterX: "andel67",
  scatterY: "pendlingsbalanse",
  scatterYear: 2024,
};

/* Farge følger kommunen, ikke rekkefølgen i utvalget: slotten låses ved
   valgtidspunkt, så en kommune som fjernes ikke maler om de andre. */
const slotOf = new Map();
function assignSlots() {
  for (const k of [...slotOf.keys()]) if (!state.selected.includes(k)) slotOf.delete(k);
  const used = new Set(slotOf.values());
  for (const k of state.selected) {
    if (slotOf.has(k)) continue;
    const free = SLOTS.find(s => !used.has(s));
    if (free) { slotOf.set(k, free); used.add(free); }
  }
}
const colorOf = k => k === TOTAL_KEY ? "var(--ink)" : `var(${slotOf.get(k) || "--s1"})`;
const nameOf  = k => k === TOTAL_KEY ? "Finnmark samlet" : REGION_BY_KEY[k].navn;

function activeSeries() {
  const out = state.selected.map(k => ({ key: k, navn: nameOf(k), farge: colorOf(k), total: false }));
  if (state.showTotal) out.unshift({ key: TOTAL_KEY, navn: "Finnmark samlet", farge: "var(--ink)", total: true });
  return out;
}
const years = () => Array.from({ length: state.to - state.from + 1 }, (_, i) => state.from + i);

/* ═══════════════════════════════════════════════════════════════════════════
   6. GRAFKOMPONENT — linje med hårkors og verktøytips
   ═════════════════════════════════════════════════════════════════════════ */
const NS = "http://www.w3.org/2000/svg";
const el = (n, a = {}) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

function niceTicks(min, max, count = 5) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const step0 = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || mag * 10;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(10));
  return out;
}

/**
 * Tegner en liten, permanent markørform ved ett datapunkt — brukt når en
 * linje trenger en ANNEN identitetsbærer enn farge (f.eks. valgtype, når
 * farge allerede er brukt til parti). En hvit ring rundt holder formen
 * lesbar der linjer/markører overlapper.
 */
function drawMarker(svg, shape, x, y, color) {
  const ring = { stroke: "var(--surface)", "stroke-width": 1.5 };
  if (shape === "square") {
    svg.appendChild(el("rect", { x: x - 4, y: y - 4, width: 8, height: 8, fill: color, ...ring }));
  } else if (shape === "triangle") {
    const pts = `${x},${y - 5} ${x - 4.6},${y + 3.5} ${x + 4.6},${y + 3.5}`;
    svg.appendChild(el("polygon", { points: pts, fill: color, ...ring }));
  } else {
    svg.appendChild(el("circle", { cx: x, cy: y, r: 3.6, fill: color, ...ring }));
  }
}

function lineChart(container, { ind, series, ys, norm, valueOf, markerShape }) {
  const getV = valueOf ?? ((k, y) => value(k, y, ind, norm, state.from));
  container.innerHTML = "";
  if (!series.length) {
    container.innerHTML = `<p class="empty">Velg minst én region i kontrollraden over.</p>`;
    return;
  }

  const W = 760, H = 300, ml = 58, mr = series.some(s => s.comparison) ? 168 : 112, mt = 12, mb = 30;
  const iw = W - ml - mr, ih = H - mt - mb;

  const data = series.map(s => ({
    ...s,
    pts: ys.map(y => ({ y, v: getV(s.key, y) })).filter(p => p.v != null),
  })).filter(s => s.pts.length);

  if (!data.length) { container.innerHTML = `<p class="empty">Ingen data for valgt periode.</p>`; return; }

  const vals = data.flatMap(s => s.pts.map(p => p.v));
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];

  const X = y => ml + (ys.length === 1 ? iw / 2 : (y - ys[0]) / (ys[ys.length - 1] - ys[0]) * iw);
  const Y = v => mt + ih - (v - y0) / (y1 - y0) * ih;

  const svg = el("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img" });
  svg.appendChild(el("title")).textContent =
    `${IND[ind].navn} ${state.from}–${state.to} for ${data.map(d => d.navn).join(", ")}`;

  for (const t of ticks) {
    svg.appendChild(el("line", { class: "gridline", x1: ml, x2: ml + iw, y1: Y(t), y2: Y(t) }));
    const lb = el("text", { x: ml - 8, y: Y(t) + 3.5, "text-anchor": "end" });
    lb.textContent = nf(t, effectiveNorm(ind, norm) === "abs" ? IND[ind].dec : 1);
    svg.appendChild(lb);
  }
  svg.appendChild(el("line", { class: "axisline", x1: ml, x2: ml + iw, y1: mt + ih, y2: mt + ih }));

  const stepY = state.visAlleAr ? 1 : Math.max(1, Math.ceil(ys.length / 9));
  ys.forEach((y, i) => {
    if (i % stepY && i !== ys.length - 1) return;
    const lb = el("text", { x: X(y), y: H - 10, "text-anchor": "middle" });
    lb.textContent = y;
    svg.appendChild(lb);
  });

  if (effectiveNorm(ind, norm) === "index") {
    svg.appendChild(el("line", { class: "gridline", x1: ml, x2: ml + iw, y1: Y(100), y2: Y(100),
      style: "stroke:var(--axis);stroke-dasharray:3 3" }));
  }

  const endLabels = [];
  for (const s of data) {
    const d = s.pts.map((p, i) => `${i ? "L" : "M"}${X(p.y).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
    const farge = s.total ? "var(--ink)" : s.farge;
    svg.appendChild(el("path", {
      class: s.total ? "serie-total" : `serie${s.comparison ? " comparison" : ""}`,
      d,
      stroke: farge,
      ...(s.comparison ? { "stroke-dasharray": s.dash } : {}),
    }));
    if (markerShape) {
      const shape = markerShape(s);
      for (const p of s.pts) drawMarker(svg, shape, X(p.y), Y(p.v), farge);
    }
    const last = s.pts[s.pts.length - 1];
    endLabels.push({ x: X(last.y) + 8, y: Y(last.v), navn: s.navn, farge });
  }

  /* Direkte etiketter er påkrevd (tre av lysmodusfargene ligger under 3:1),
     så de må alltid tegnes — og derfor må de skyves fra hverandre når linjene
     ender tett på hverandre. */
  const GAP = 13;
  endLabels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < endLabels.length; i++) {
    if (endLabels[i].y - endLabels[i - 1].y < GAP) endLabels[i].y = endLabels[i - 1].y + GAP;
  }
  const spill = endLabels.length ? endLabels[endLabels.length - 1].y - (mt + ih) : 0;
  if (spill > 0) for (const l of endLabels) l.y -= spill;
  for (const l of endLabels) {
    const lb = el("text", { class: "endlabel", x: l.x, y: l.y + 3.5, fill: l.farge });
    lb.textContent = l.navn;
    svg.appendChild(lb);
  }

  const cross = el("line", { class: "crosshair", y1: mt, y2: mt + ih, style: "display:none" });
  svg.appendChild(cross);
  const dots = el("g");
  svg.appendChild(dots);

  const wrap = document.createElement("div");
  wrap.className = "chart-wrap";
  wrap.appendChild(svg);
  const tip = document.createElement("div");
  tip.className = "tooltip";
  wrap.appendChild(tip);
  container.appendChild(wrap);

  const hit = el("rect", { x: ml, y: mt, width: iw, height: ih, fill: "transparent" });
  svg.appendChild(hit);

  function move(ev) {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    let best = ys[0], bd = Infinity;
    for (const y of ys) { const d = Math.abs(X(y) - px); if (d < bd) { bd = d; best = y; } }

    cross.setAttribute("x1", X(best)); cross.setAttribute("x2", X(best));
    cross.style.display = "";
    dots.innerHTML = "";

    let rows = "";
    for (const s of data) {
      const p = s.pts.find(q => q.y === best);
      if (!p) continue;
      const c = s.total ? "var(--ink)" : s.farge;
      dots.appendChild(el("circle", { class: "dot", cx: X(best), cy: Y(p.v), r: 4, fill: c }));
      rows += `<div class="tt-row"><span class="tt-name"><i class="tt-key" style="--k:${c}"></i>${s.navn}</span>` +
              `<span class="tt-val">${fmt(p.v, ind, norm)}</span></div>`;
    }
    tip.innerHTML = `<div class="tt-head">${best}</div>${rows}`;
    tip.setAttribute("data-show", "");

    const relX = X(best) / W * r.width;
    tip.style.left = Math.min(Math.max(relX + 14, 4), r.width - tip.offsetWidth - 4) + "px";
    tip.style.top = "8px";
  }
  function leave() { cross.style.display = "none"; dots.innerHTML = ""; tip.removeAttribute("data-show"); }
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerleave", leave);
}

/* ═══════════════════════════════════════════════════════════════════════════
   7. FELLESBITER
   ═════════════════════════════════════════════════════════════════════════ */
/* Finnmark samlet er summen av de samme kommunene, så i absolutt målform
   ligger den en størrelsesorden over enhver enkeltkommune. To akser ville
   «løst» det og samtidig gjort grafen uleselig — riktig svar er å bytte
   målform, så vi sier det i stedet. */
function scaleHint(ind, series, norm) {
  const mixed = series.some(s => s.total) && series.some(s => !s.total);
  if (!mixed || effectiveNorm(ind, norm) !== "abs" || !IND[ind].additiv) return "";
  return `<p class="cap-note" style="margin:8px 0 0">
    Finnmark samlet er summen av kommunene og ligger derfor langt over dem på samme akse.
    <button class="linkish" type="button" data-setnorm="index">Bytt til indeks</button>
    for å sammenligne utvikling i stedet for nivå.</p>`;
}

/* Folkemengde og andel av befolkningen er de aldersoppdelte indikatorene, og
   der er serien aldersgrupper — ikke kommuner. Kommuneutvalget summeres da
   til én region. */
const ageSeriesActive = (tema, ind) => tema === "befolkning" && (ind === "folkemengde" || ind === "andelbefolkning");

/** Hvilke kommuner som summeres til grafens ene region. */
function sumRegions() {
  if (state.showTotal) {
    return { keys: [TOTAL_KEY], label: "Finnmark samlet (18 kommuner)" };
  }
  if (!state.selected.length) {
    return { keys: [], label: "Ingen kommuner valgt" };
  }
  return {
    keys: state.selected,
    label: state.selected.length === 1
      ? nameOf(state.selected[0])
      : `${state.selected.map(nameOf).join(" + ")}`,
  };
}

/* Farge følger aldersgruppen, ikke rekkefølgen i utvalget — samme regel som
   for kommuner, så et bånd ikke bytter farge når et annet fjernes. */
const ageSlotOf = new Map();
function assignAgeSlots() {
  for (const k of [...ageSlotOf.keys()]) if (!state.ageBands.includes(k)) ageSlotOf.delete(k);
  const used = new Set(ageSlotOf.values());
  for (const k of state.ageBands) {
    if (ageSlotOf.has(k)) continue;
    const free = SLOTS.find(s => !used.has(s));
    if (free) { ageSlotOf.set(k, free); used.add(free); }
  }
}

function ageSeries() {
  const by = Object.fromEntries(AGE_BANDS.map(b => [b.key, b]));
  return state.ageBands.slice()
    .sort((a, b) => by[a].lo - by[b].lo)
    .map(k => ({ key: k, navn: `${by[k].navn} år`, farge: `var(${ageSlotOf.get(k) || "--s1"})`, total: false }));
}

/** Verdi for én aldersgruppe, summert over de valgte kommunene. */
function ageValue(bandKey, ar, norm, ind) {
  const { keys } = sumRegions();
  const sum = y => keys.reduce((s, r) => s + popBand(r, y, bandKey), 0);

  if (ind === "andelbefolkning") {
    // Egen prosentandel av befolkningen — uavhengig av Måleform-bryteren
    // (per1000 gir ikke mening på en verdi som allerede er en andel).
    const andel = y => {
      const p = keys.reduce((s, r) => s + (popOf(r, y) || 0), 0);
      return p ? (sum(y) / p) * 100 : null;
    };
    if (norm === "index") {
      const b = andel(state.from);
      const v = andel(ar);
      return b && v != null ? +((v / b) * 100).toFixed(1) : null;
    }
    const v = andel(ar);
    return v == null ? null : +v.toFixed(1);
  }

  if (norm === "index") {
    const b = sum(state.from);
    return b ? +(sum(ar) / b * 100).toFixed(1) : null;
  }
  if (norm === "per1000") {
    const p = keys.reduce((s, r) => s + (popOf(r, ar) || 0), 0);
    return p ? +(sum(ar) / p * 1000).toFixed(1) : null;
  }
  return sum(ar);
}

function ageReferenceValue(seriesKey, ar, norm, ind) {
  const [, refKey, bandKey] = seriesKey.split(":");
  const ref = AGE_REFERENCE_BY_KEY[refKey];
  if (!ref) return null;
  const band = y => AGE_REFERENCE_DATA.get(`${ref.dataKey}|${y}|${bandKey}`) ?? null;
  const total = y => AGE_BANDS.reduce((sum, b) =>
    sum + (AGE_REFERENCE_DATA.get(`${ref.dataKey}|${y}|${b.key}`) ?? 0), 0);

  if (ind === "andelbefolkning") {
    const andel = y => {
      const b = band(y), t = total(y);
      return b != null && t ? b / t * 100 : null;
    };
    if (norm === "index") {
      const base = andel(state.from), v = andel(ar);
      return base && v != null ? +((v / base) * 100).toFixed(1) : null;
    }
    const v = andel(ar);
    return v == null ? null : +v.toFixed(1);
  }
  if (norm === "index") {
    const base = band(state.from), v = band(ar);
    return base && v != null ? +((v / base) * 100).toFixed(1) : null;
  }
  if (norm === "per1000") {
    const v = band(ar), t = total(ar);
    return v != null && t ? +((v / t) * 1000).toFixed(1) : null;
  }
  return null;
}

function ageReferenceSeries(primary, ind, norm) {
  if (ind === "folkemengde" && norm === "abs") return [];
  return state.ageReferences.flatMap((refKey) => {
    const ref = AGE_REFERENCE_BY_KEY[refKey];
    if (!ref) return [];
    return primary.map((s) => ({
      key: `ref:${refKey}:${s.key}`,
      navn: `${s.navn} · ${ref.navn}`,
      farge: s.farge,
      total: false,
      comparison: true,
      dash: ref.dash,
    }));
  });
}

function ageChartValue(key, ar, norm, ind) {
  return key.startsWith("ref:") ? ageReferenceValue(key, ar, norm, ind) : ageValue(key, ar, norm, ind);
}

/* Hurtigvalgene gir sett på maks åtte bånd, siden hvert bånd nå er en egen
   linje og paletten har åtte skillbare farger. «Alle 19» finnes derfor ikke —
   det ville vært elleve linjer uten farge å tegne dem med. */
const AGE_PICKS = {
  ung:   { navn: "0–19",  lo: 0,  hi: 15 },
  unge:  { navn: "20–39", lo: 20, hi: 35 },
  midt:  { navn: "40–64", lo: 40, hi: 60 },
  eldre: { navn: "65+",   lo: 65, hi: 90 },
};

function ageChips(ind) {
  if (ind !== "folkemengde" && ind !== "andelbefolkning") return "";
  const sel = new Set(state.ageBands);
  const atCap = state.ageBands.length >= MAX_SERIES;
  const note = !state.ageBands.length
    ? "Ingen aldersgrupper valgt — velg minst én for å se tall."
    : atCap
      ? `Grensen på ${MAX_SERIES} grupper er nådd. Fjern én for å legge til en annen.`
      : `${state.ageBands.length} av maks ${MAX_SERIES} grupper: ${selectedAgeLabel()}`;

  return `<div class="field" style="margin:2px 0 12px">
    <span class="field-label">Aldersgrupper — én linje hver</span>
    <div class="mini-actions" style="margin:0 0 6px">
      ${Object.entries(AGE_PICKS).map(([k, v]) =>
        `<button class="linkish" type="button" data-agepick="${k}">${v.navn}</button>`).join("")}
      <button class="linkish" type="button" data-agepick="ingen">Fjern alle</button>
    </div>
    <div class="chips">${AGE_BANDS.map(b => {
      const on = sel.has(b.key);
      return `<button class="chip" type="button" data-ageband="${b.key}" aria-pressed="${on}"
        ${!on && atCap ? "disabled" : ""} style="--sw:${on ? `var(${ageSlotOf.get(b.key) || "--s1"})` : "transparent"}">
        <i class="swatch"></i>${b.navn}</button>`;
    }).join("")}</div>
    <p class="cap-note" style="margin:6px 0 0">${note}</p>
  </div>`;
}

function ageReferenceControls(ind) {
  const disabled = ind === "folkemengde" && state.norm === "abs";
  const selected = new Set(state.ageReferences);
  const atCap = selected.size >= 2;
  const dataNote = AGE_REFERENCE_DATA.size
    ? "Velg inntil to nasjonale referanser. Sentralitetsgruppene følger SSBs offisielle inndeling og finnes fra 2018."
    : "Referansedata må hentes én gang fra SSB tabell 07459 og KLASS i admin.";
  return `<div class="field" style="margin:2px 0 12px">
    <span class="field-label">Sammenlign med</span>
    <div class="chips">${AGE_REFERENCES.map(ref => {
      const on = selected.has(ref.key);
      return `<button class="chip" type="button" data-ageref="${ref.key}" aria-pressed="${on}"
        ${disabled || (!on && atCap) ? "disabled" : ""}>
        ${ref.navn}</button>`;
    }).join("")}</div>
    <p class="cap-note" style="margin:6px 0 0">${disabled
      ? "Velg andel, per 1 000 eller indeks for å sammenligne områder med ulik folkemengde."
      : dataNote}</p>
  </div>`;
}

function legendHTML(series) {
  if (series.length < 2) return "";
  return `<div class="legend">` + series.map(s =>
    `<span class="item"><i class="key ${s.total ? "total" : ""} ${s.comparison ? "comparison" : ""}" style="--k:${s.farge}"></i>${s.navn}</span>`
  ).join("") + `</div>`;
}

function tilesHTML(ind, series, norm, valueOf) {
  const getV = valueOf ?? ((k, y) => value(k, y, ind, norm, state.from));
  const yEnd = state.to, yStart = state.from;
  return `<div class="tiles">` + series.map(s => {
    const a = getV(s.key, yStart);
    const b = getV(s.key, yEnd);
    let delta = "";
    if (a != null && b != null && a !== 0) {
      const pct = (b - a) / Math.abs(a) * 100;
      const cls = pct >= 0 ? "up" : "down";
      delta = `<span class="t-delta ${cls}">${pct >= 0 ? "▲" : "▼"} ${nf(Math.abs(pct), 1)} %</span>`;
    }
    return `<div class="tile">
      <span class="t-name"><i class="key ${s.comparison ? "comparison" : ""}" style="--k:${s.farge}"></i><span>${s.navn}</span></span>
      <span><span class="t-val">${fmt(b, ind, norm)}</span>${delta}</span>
    </div>`;
  }).join("") + `</div>`;
}

function tableHTML(ind, series, ys, norm, valueOf) {
  const getV = valueOf ?? ((k, y) => value(k, y, ind, norm, state.from));
  const head = `<tr><th>Region</th>${ys.map(y => `<th>${y}</th>`).join("")}<th>Kilde</th></tr>`;
  const body = series.map(s => {
    const cells = ys.map(y => `<td>${fmt(getV(s.key, y), ind, norm)}</td>`).join("");
    const nm = s.total ? `Finnmark samlet`
      : REGION_BY_KEY[s.key]
        ? `${REGION_BY_KEY[s.key].navn} <span class="sami">${REGION_BY_KEY[s.key].sami}</span>`
        : s.navn;
    return `<tr class="${s.total ? "total-row" : ""}">
      <td><span class="muni-key"><i class="key" style="--k:${s.farge}"></i>${nm}</span></td>
      ${cells}<td>${kildeHTML(IND[ind].kilde, true)}</td></tr>`;
  }).join("");
  return `<div class="table-scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function indPicker(tema, current) {
  const opts = Object.entries(IND).filter(([, m]) => m.tema === tema)
    .map(([k, m]) => `<option value="${k}"${k === current ? " selected" : ""}>${m.navn}</option>`).join("");
  return `<select data-indpicker="${tema}" aria-label="Indikator">${opts}</select>`;
}

/* ═══════════════════════════════════════════════════════════════════════════

const TABS = [
  { id: "befolkning",   navn: "Befolkning" },
  { id: "okonomi",      navn: "Kommuneøkonomi" },
  { id: "naering",      navn: "Næring og arbeidsplasser" },
  { id: "valg",         navn: "Valgresultat" },
  { id: "valganalyser", navn: "Valganalyser" },
  { id: "sammen",       navn: "Sammenstillinger" },
];

const BLURB = {
  befolkning: "Folketall og demografisk sammensetning. Fødselsoverskudd og nettoflytting forklarer hvorfor kurven for folkemengde beveger seg.",
  okonomi: "Nøkkeltall fra kommuneregnskapene. Netto driftsresultat og disposisjonsfond sier noe om handlingsrom; lånegjeld sier noe om bindinger.",

function renderThemePanel(tema, host) {

  const byAge = ageSeriesActive(tema, ind);

  const primarySeries = byAge ? ageSeries() : activeSeries();
  const comparisonSeries = byAge ? ageReferenceSeries(primarySeries, ind, state.norm) : [];

  const beskrivelse = byAge
    ? `Én linje per aldersgruppe. Kommunene i utvalget summeres til én region, så
       kurvene viser hvordan hver kohort har utviklet seg i området samlet —
       ikke hvordan kommunene skiller seg fra hverandre.`

    ${tema === "befolkning" ? befViewSwitch() : ""}
    <div class="split">
      <section class="card">
        <div class="card-head">

          <span class="unit">${unitFor(ind, state.norm)}</span>

        ${region ? `<p class="cap-note" style="margin:-6px 0 12px">
          <strong style="color:var(--ink-2)">Region:</strong> ${region.label}</p>` : ""}
        <div style="margin-bottom:10px">${indPicker(tema, ind)}</div>
        ${tema === "befolkning" ? ageChips(ind) : ""}
        ${byAge ? ageReferenceControls(ind) : ""}
        ${byAge ? "" : scaleHint(ind, series, state.norm)}
        ${legendHTML(series)}
        <div data-chart></div>
        <div class="source">
          <span>Kilde: ${kildeHTML(IND[ind].kilde)}${comparisonSeries.length ? ` + ${kildeHTML("ssb:11805")}` : ""}</span>
          <span>Hentet: ${byAge ? hentet("__struktur") : hentet(ind)}</span>
          <span>${state.from}–${state.to}</span>
        </div>
        <details class="tableview"><summary>Vis tallene i tabell</summary>
          ${tableHTML(ind, series, ys, state.norm, valueOf)}

      </section>

      <aside class="card">
        <div class="card-head"><h2>Nivå ${state.to}</h2></div>
        <p class="desc">Endring vist mot ${state.from}.</p>
        ${series.length
          ? tilesHTML(ind, series, state.norm, valueOf)
          : `<p class="empty">${byAge ? "Ingen aldersgrupper valgt." : "Ingen regioner valgt."}</p>`}

    </div>`;

  lineChart(host.querySelector("[data-chart]"), { ind, series, ys, norm: state.norm, valueOf });

/* ── Befolkningspyramide: alder × kjønn, med endring over perioden ───────── */
function popRange(region, ar, lo, hi) {
  return AGE_BANDS.filter(b => b.lo >= lo && b.lo <= hi)
    .reduce((s, b) => s + popBand(region, ar, b.key), 0);
}

function renderPyramid(host) {
  const reg = state.pyrRegion;
  const regNavn = reg === TOTAL_KEY ? "Finnmark samlet" : REGION_BY_KEY[reg].navn;
  const yNow = state.to, yBase = state.from;
  const pct = state.pyrMode === "prosent";

  const totNow = popTotal(reg, yNow) || 1;
  const totBase = popTotal(reg, yBase) || 1;
  const val = (ar, kj, band) => {
    const raw = pop(reg, ar, kj, band);
    return pct ? raw / (ar === yNow ? totNow : totBase) * 100 : raw;
  };

  /* Felles skala for begge år og begge kjønn — ellers kan ikke omrisset
     for basisåret sammenlignes med søylene for sluttåret. */
  let maxV = 0;
  for (const b of AGE_BANDS) for (const ar of [yNow, yBase]) for (const kj of ["m", "k"]) {
    maxV = Math.max(maxV, val(ar, kj, b.key));
  }
  maxV = maxV || 1;

  const W = 760, H = 446, mt = 30, mb = 38, side = 8, mid = 54;
  const half = (W - side * 2 - mid) / 2;
  const cxL = side + half, cxR = side + half + mid;
  const ih = H - mt - mb;
  const bandH = ih / AGE_BANDS.length;
  const barH = Math.max(6, bandH - 5);          /* 5px luft mellom båndene */

  const yOf = i => mt + (AGE_BANDS.length - 1 - i) * bandH;
  const len = v => (v / maxV) * half;

  const ticks = niceTicks(0, maxV, 4).filter(t => t >= 0 && t <= maxV * 1.001);
  let grid = "", axis = "";
  for (const t of ticks) {
    const d = len(t);
    for (const [cx, dir] of [[cxL, -1], [cxR, 1]]) {
      grid += `<line class="gridline" x1="${cx + dir * d}" x2="${cx + dir * d}" y1="${mt}" y2="${mt + ih}"/>`;
      axis += `<text x="${cx + dir * d}" y="${mt + ih + 15}" text-anchor="middle">${
        pct ? nf(t, 1) : nf(t, 0)}</text>`;
    }
  }

  let bars = "", ghost = "", labels = "";
  const gp = { m: [], k: [] };

  AGE_BANDS.forEach((b, i) => {
    const y = yOf(i), yc = y + bandH / 2, yb = y + (bandH - barH) / 2;

    for (const [kj, cx, dir, col] of [["m", cxL, -1, "var(--s1)"], ["k", cxR, 1, "var(--s2)"]]) {
      const v = val(yNow, kj, b.key);
      const L = len(v);
      const x = dir < 0 ? cx - L : cx;
      bars += `<rect x="${x.toFixed(1)}" y="${yb.toFixed(1)}" width="${L.toFixed(1)}" height="${barH.toFixed(1)}"
        rx="1.5" fill="${col}"><title>${kj === "m" ? "Menn" : "Kvinner"} ${b.navn} (${yNow}): ${
        pct ? nf(v, 2) + " %" : nf(v, 0) + " personer"}</title></rect>`;

      const vb = val(yBase, kj, b.key), Lb = len(vb);
      const xb = dir < 0 ? cx - Lb : cx + Lb;
      /* Båndene itereres nedenfra og opp (i = 0 er yngst og nederst), så
         konturen må gå inn ved båndets underkant og ut ved overkanten —
         ellers krysser stien seg selv i stedet for å bli en trapp. */
      gp[kj].push(`${xb.toFixed(1)},${(y + bandH).toFixed(1)}`, `${xb.toFixed(1)},${y.toFixed(1)}`);
    }

    labels += `<text x="${(cxL + mid / 2 + 0.5).toFixed(1)}" y="${(yc + 3.5).toFixed(1)}"
      text-anchor="middle" style="fill:var(--ink-2)">${b.navn}</text>`;
  });

  for (const kj of ["m", "k"]) {
    ghost += `<polyline points="${gp[kj].join(" ")}" fill="none" stroke="var(--ink-muted)"
      stroke-width="1.5" stroke-dasharray="3 2.5" stroke-linejoin="round"/>`;
  }

  /* Nøkkeltall — hovedgruppene, ikke femårsbåndene. */
  const groups = [
    { navn: "0–19 år",  lo: 0,  hi: 15 },
    { navn: "20–66 år", lo: 20, hi: 65 },
    { navn: "67 år +",  lo: 65, hi: 90 },
  ];
  const tiles = groups.map(g => {
    const a = popRange(reg, yBase, g.lo, g.hi), b2 = popRange(reg, yNow, g.lo, g.hi);
    const sa = a / totBase * 100, sb = b2 / totNow * 100;
    const dpp = sb - sa;
    return `<div class="tile">
      <span class="t-name"><span>${g.navn}</span></span>
      <span><span class="t-val">${nf(b2, 0)}</span>
      <span class="t-delta">${nf(sb, 1)} %</span>
      <span class="t-delta ${dpp >= 0 ? "up" : "down"}">${dpp >= 0 ? "▲" : "▼"} ${nf(Math.abs(dpp), 1)} pp</span></span>
    </div>`;
  }).join("");

  const kvNow = AGE_BANDS.reduce((s, b) => s + pop(reg, yNow, "k", b.key), 0);
  const kvBase = AGE_BANDS.reduce((s, b) => s + pop(reg, yBase, "k", b.key), 0);
  const yrkes = popRange(reg, yNow, 20, 65) || 1;
  const yrkesB = popRange(reg, yBase, 20, 65) || 1;
  const fbNow = (popRange(reg, yNow, 0, 15) + popRange(reg, yNow, 65, 90)) / yrkes * 100;
  const fbBase = (popRange(reg, yBase, 0, 15) + popRange(reg, yBase, 65, 90)) / yrkesB * 100;

  const extra = `
    <div class="tile"><span class="t-name"><span>Folkemengde</span></span>
      <span><span class="t-val">${nf(totNow, 0)}</span>
      <span class="t-delta ${totNow >= totBase ? "up" : "down"}">${totNow >= totBase ? "▲" : "▼"} ${
        nf(Math.abs((totNow - totBase) / totBase * 100), 1)} %</span></span></div>
    <div class="tile"><span class="t-name"><span>Kvinneandel</span></span>
      <span><span class="t-val">${nf(kvNow / totNow * 100, 1)} %</span>
      <span class="t-delta">${nf(kvBase / totBase * 100, 1)} % i ${yBase}</span></span></div>
    <div class="tile"><span class="t-name"><span>Forsørgerbrøk</span></span>
      <span><span class="t-val">${nf(fbNow, 1)}</span>
      <span class="t-delta">${nf(fbBase, 1)} i ${yBase}</span></span></div>`;

  const rows = AGE_BANDS.slice().reverse().map(b => {
    const m = pop(reg, yNow, "m", b.key), k = pop(reg, yNow, "k", b.key), t = m + k;
    const tb = popBand(reg, yBase, b.key);
    const sh = t / totNow * 100, shb = tb / totBase * 100;
    const d = t - tb, dpp = sh - shb;
    return `<tr>
      <td>${b.navn}</td>
      <td>${nf(m, 0)}</td><td>${nf(k, 0)}</td><td>${nf(t, 0)}</td>
      <td>${nf(sh, 2)}</td>
      <td>${nf(tb, 0)}</td><td>${nf(shb, 2)}</td>
      <td class="${d >= 0 ? "up" : "down"}">${d >= 0 ? "+" : "−"}${nf(Math.abs(d), 0)}</td>
      <td class="${dpp >= 0 ? "up" : "down"}">${dpp >= 0 ? "+" : "−"}${nf(Math.abs(dpp), 2)}</td>
    </tr>`;
  }).join("");

  host.innerHTML = `
    ${befViewSwitch()}
    <div class="split">
      <section class="card">
        <div class="card-head">
          <h2>Alders- og kjønnsfordeling — ${regNavn}</h2>
          <span class="unit">${pct ? "% av folkemengden" : "personer"} · ${yNow}</span>
        </div>
        <p class="desc">Søylene viser ${yNow}. Den stiplede konturen er ${yBase}, så forskyvningen
        mellom årene kan leses direkte. Bytt til prosent når folkemengden har endret seg —
        da er de to årene sammenlignbare i form, ikke bare i størrelse.</p>

        <div class="rail-row" style="gap:18px;margin-bottom:12px">
          <select data-pyrregion aria-label="Region">
            <option value="${TOTAL_KEY}"${reg === TOTAL_KEY ? " selected" : ""}>Finnmark samlet</option>
            ${REGIONS.map(r => `<option value="${r.key}"${reg === r.key ? " selected" : ""}>${r.navn}</option>`).join("")}
          </select>
          <div class="seg" role="group" aria-label="Måleform for pyramiden">
            <button type="button" data-pyrmode="antall" aria-pressed="${!pct}">Antall</button>
            <button type="button" data-pyrmode="prosent" aria-pressed="${pct}">Prosent</button>
          </div>
        </div>

        <div class="legend">
          <span class="item"><i class="key" style="--k:var(--s1);height:9px;width:9px;border-radius:2px"></i>Menn ${yNow}</span>
          <span class="item"><i class="key" style="--k:var(--s2);height:9px;width:9px;border-radius:2px"></i>Kvinner ${yNow}</span>
          <span class="item"><i class="key" style="--k:var(--ink-muted);height:0;border-top:1.5px dashed var(--ink-muted);width:14px"></i>${yBase} (kontur)</span>
        </div>

        <svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
          <title>Befolkningspyramide for ${regNavn}, ${yNow} sammenlignet med ${yBase}</title>
          ${grid}
          <text x="${(cxL - half / 2).toFixed(1)}" y="18" text-anchor="middle"
            style="fill:var(--ink-2);font-weight:600">Menn</text>
          <text x="${(cxR + half / 2).toFixed(1)}" y="18" text-anchor="middle"
            style="fill:var(--ink-2);font-weight:600">Kvinner</text>
          ${bars}${ghost}${labels}
          <line class="axisline" x1="${side}" x2="${cxL}" y1="${mt + ih}" y2="${mt + ih}"/>
          <line class="axisline" x1="${cxR}" x2="${W - side}" y1="${mt + ih}" y2="${mt + ih}"/>
          ${axis}
        </svg>

        <div class="source">
          <span>Kilde: ${kildeHTML("ssb:07459")}</span><span>Hentet: ${hentet("__struktur")}</span>
          <span>${yBase} → ${yNow}</span>
        </div>

        <details class="tableview"><summary>Vis antall og andel i tabell</summary>
          <div class="table-scroll"><table>
            <thead><tr>
              <th>Aldersgruppe</th>
              <th>Menn ${yNow}</th><th>Kvinner ${yNow}</th><th>Totalt ${yNow}</th><th>Andel ${yNow} (%)</th>
              <th>Totalt ${yBase}</th><th>Andel ${yBase} (%)</th>
              <th>Endring</th><th>Endring (pp)</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table></div>
        </details>
      </section>

      <aside class="card">
        <div class="card-head"><h2>Hovedgrupper ${yNow}</h2></div>
        <p class="desc">Andel av folkemengden, med endring i prosentpoeng fra ${yBase}.</p>
        <div class="tiles">${tiles}${extra}</div>
      </aside>
    </div>`;
}

function befViewSwitch() {
  return `<div class="seg" role="group" aria-label="Visning" style="align-self:start">
    <button type="button" data-befview="struktur" aria-pressed="${state.befView === "struktur"}">Alder og kjønn</button>
    <button type="button" data-befview="tidsserie" aria-pressed="${state.befView === "tidsserie"}">Tidsserie</button>
  </div>`;
}

/* ── Valg ───────────────────────────────────────────────────────────────── */
/**
 * Dispatcher for hele valg-fanen: én visningsvelger øverst (Oppslutning /
 * Mandatfordeling / Utvikling over tid), samme delegerte click-mønster som
 * resten av siden — bare state.valgVisning endres, render() gjør resten.
 */
function renderValg(host) {
  host.innerHTML = `
    <div class="rail-row" style="gap:18px;margin-bottom:16px">
      <div class="seg" role="group" aria-label="Visning">
        <button type="button" data-valgvisning="oppslutning" aria-pressed="${state.valgVisning === "oppslutning"}">Oppslutning</button>
        <button type="button" data-valgvisning="mandater" aria-pressed="${state.valgVisning === "mandater"}">Mandatfordeling</button>
        <button type="button" data-valgvisning="utvikling" aria-pressed="${state.valgVisning === "utvikling"}">Utvikling over tid</button>
      </div>
    </div>
    <div id="valgInnhold"></div>`;
  const inner = host.querySelector("#valgInnhold");
  if (state.valgVisning === "mandater") renderHemicycle(inner);
  else if (state.valgVisning === "utvikling") renderValgTidsserie(inner);
  else renderValgOppslutning(inner);
}

function renderValgOppslutning(host) {
  const v = VALG[state.valgtype];
  const reg = state.valgRegion;
  const regNavn = reg === TOTAL_KEY ? "Finnmark samlet" : REGION_BY_KEY[reg].navn;
  const andel = (parti, ar) => valgAndelAggregert(state.valgtype, reg, ar, parti);

  const W = 700, H = 300, ml = 44, mr = 16, mt = 12, mb = 34;
  const iw = W - ml - mr, ih = H - mt - mb;
  const bw = Math.min(70, iw / v.ar.length * 0.56);

  let bars = "";
  v.ar.forEach((ar, i) => {
    const cx = ml + (i + 0.5) * (iw / v.ar.length);
    let acc = 0;
    PARTIER.forEach(p => {
      const a = andel(p.key, ar) ?? 0;
      const y0 = mt + ih - (acc + a) / 100 * ih;
      const hgt = Math.max(0, a / 100 * ih - 2);   /* 2px mellomrom mellom segmenter */
      bars += `<rect x="${cx - bw / 2}" y="${y0}" width="${bw}" height="${hgt}" rx="1.5"
                fill="${p.farge}"><title>${p.navn} ${ar}: ${nf(a, 1)} %</title></rect>`;
      if (a >= 7) {
        bars += `<text class="seglabel" x="${cx}" y="${y0 + hgt / 2 + 3.5}"
                  text-anchor="middle">${p.navn}</text>`;
      }
      acc += a;
    });
    bars += `<text x="${cx}" y="${H - 12}" text-anchor="middle">${ar}</text>`;
  });

  let gridl = "";
  for (let p = 0; p <= 100; p += 25) {
    const y = mt + ih - p / 100 * ih;
    gridl += `<line class="gridline" x1="${ml}" x2="${ml + iw}" y1="${y}" y2="${y}"/>
              <text x="${ml - 8}" y="${y + 3.5}" text-anchor="end">${p} %</text>`;
  }

  const tblHead = `<tr><th>Parti</th>${v.ar.map(a => `<th>${a}</th>`).join("")}<th>Kilde</th></tr>`;
  const tblBody = PARTIER.map(p =>
    `<tr><td><span class="muni-key"><i class="key" style="--k:${p.farge}"></i>${p.navn}</span></td>` +
    v.ar.map(a => `<td>${nf(andel(p.key, a), 1)}</td>`).join("") +
    `<td><span class="pill">${v.kilde}</span></td></tr>`
  ).join("");

  host.innerHTML = `
    <section class="card">
      <div class="card-head">
        <h2>${v.navn} — ${regNavn}</h2>
        <span class="unit">andel av stemmene, %</span>
      </div>
      <p class="desc">Valg er ikke en årlig tidsserie, men diskrete hendelser — derfor stablede
      andeler per valgår i stedet for linjer. Finnmark samlet er folketallsvektet.</p>

      <div class="rail-row" style="gap:18px;margin-bottom:12px">

}

/**
 * Mandatfordeling som halvsirkel — storting/fylkesting, ett valgår av
 * gangen. Seter plasseres på konsentriske buer (radius-proporsjonal
 * fordeling per bue, slik at avstanden mellom seter holder seg noenlunde
 * jevn), og fylles med parti i PARTI_ORDEN-rekkefølge sortert på VINKEL på
 * tvers av ALLE buene samtidig — slik at hvert parti får en sammenhengende
 * kile som i referansebildet, ikke én ring per parti.
 */
function renderHemicycle(host) {
  const valgtype = state.hemiValgtype;
  const v = VALG[valgtype];
  const ar = v.ar.includes(state.hemiYear) ? state.hemiYear : v.ar[v.ar.length - 1];

  const mandater = mandaterFor(valgtype, ar).slice().sort((a, b) => {
    const oa = ordenForPartikode(a.kode), ob = ordenForPartikode(b.kode);
    return oa !== ob ? oa - ob : b.mandater - a.mandater;
  });
  const total = mandater.reduce((s, m) => s + m.mandater, 0);

  if (!total) {
    host.innerHTML = `<section class="card"><p class="empty">Ingen mandatdata for ${v.navn.toLowerCase()} ${ar}.</p></section>`;
    return;
  }

  const rows = total <= 10 ? 1 : total <= 25 ? 2 : total <= 50 ? 3 : 4;
  const r0 = 70, r1 = 200;
  const rowRadii = Array.from({ length: rows }, (_, i) => rows === 1 ? r1 : r0 + i * (r1 - r0) / (rows - 1));
  const eksakt = rowRadii.map(r => (r / rowRadii.reduce((a, b) => a + b, 0)) * total);
  const heltall = eksakt.map(Math.floor);
  let rest = total - heltall.reduce((a, b) => a + b, 0);
  eksakt
    .map((e, i) => ({ i, r: e - heltall[i] }))
    .sort((a, b) => b.r - a.r)
    .slice(0, rest)
    .forEach(({ i }) => heltall[i]++);

  const cx = 260, cy = 230;
  const seats = [];
  heltall.forEach((count, ri) => {
    const r = rowRadii[ri];
    for (let s = 0; s < count; s++) {
      const t = count === 1 ? 0.5 : s / (count - 1);
      const theta = Math.PI - t * Math.PI;
      seats.push({ x: cx + r * Math.cos(theta), y: cy - r * Math.sin(theta), theta });
    }
  });
  seats.sort((a, b) => b.theta - a.theta);

  let idx = 0;
  const seatFill = [];
  for (const m of mandater) {
    for (let i = 0; i < m.mandater; i++) { seatFill.push({ ...seats[idx], kode: m.kode, navn: m.navn }); idx++; }
  }

  const seatEls = seatFill.map(s =>
    `<circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="8" fill="${fargeForPartikode(s.kode)}"><title>${s.navn}</title></circle>`
  ).join("");

  const legendItems = mandater.map(m =>
    `<span class="item"><i class="key" style="--k:${fargeForPartikode(m.kode)}"></i>${m.navn} (${m.mandater})</span>`
  ).join("");

  const ekte = [...MANDAT_EKTE.keys()].some(k => k.startsWith(`${valgtype}|${ar}|`));

  host.innerHTML = `
    <section class="card">
      <div class="card-head">
        <h2>${v.navn} — mandatfordeling ${ar}</h2>
        <span class="unit">${total} mandater</span>
      </div>
      <p class="desc">Mandatene fordeles på hele ${valgtype === "storting" ? "valgdistriktet" : "fylket"}, ikke per
      kommune — derfor ingen regionvelger her.</p>

      <div class="rail-row" style="gap:18px;margin-bottom:12px">
        <div class="seg" role="group" aria-label="Valgtype">
          <button type="button" data-hemivalgtype="storting" aria-pressed="${valgtype === "storting"}">Stortingsvalg</button>
          <button type="button" data-hemivalgtype="fylkesting" aria-pressed="${valgtype === "fylkesting"}">Fylkestingsvalg</button>
        </div>
        <select data-hemiyear aria-label="År">
          ${v.ar.map(y => `<option value="${y}"${y === ar ? " selected" : ""}>${y}</option>`).join("")}
        </select>
      </div>

      <svg class="chart" viewBox="0 0 520 250" role="img">
        <title>${v.navn} ${ar}, mandatfordeling</title>
        ${seatEls}
      </svg>

      <div class="legend">${legendItems}</div>

      <div class="source"><span>Kilde: ${kildeHTML(v.kilde)}</span><span>Hentet: ${ekte ? hentet("__valg") : "—"}</span></div>
    </section>`;
}

const VALGTYPE_KORT = { kommune: "K", storting: "S", fylkesting: "F" };
const MARKER_FOR_VALGTYPE = { kommune: "circle", storting: "triangle", fylkesting: "square" };

/**
 * Oppslutning over tid, én linje per parti×valgtype. Farge bærer parti-
 * identitet (samme farge uansett valgtype), markørform bærer valgtype-
 * identitet (sirkel/trekant/kvadrat) — nødvendig når flere valgtyper
 * overlegges samtidig, siden farge allerede er brukt opp av partiet.
 * Bruker samme region (state.valgRegion) og periode (state.from/state.to)
 * som resten av panelet, ikke egne kontroller for det.
 */
function renderValgTidsserie(host) {
  const reg = state.valgRegion;
  const regNavn = reg === TOTAL_KEY ? "Finnmark samlet" : REGION_BY_KEY[reg].navn;

  const series = [];
  for (const partiKey of state.trendPartier) {
    const p = PARTIER.find(x => x.key === partiKey);
    if (!p) continue;
    for (const valgtype of state.trendTyper) {
      series.push({
        key: `${partiKey}|${valgtype}`,
        navn: state.trendTyper.length > 1 ? `${p.navn} (${VALGTYPE_KORT[valgtype]})` : p.navn,
        farge: p.farge,
        valgtype,
      });
    }
  }

  const ys = [...new Set(state.trendTyper.flatMap(vt => VALG[vt].ar))]
    .filter(y => y >= state.from && y <= state.to)
    .sort((a, b) => a - b);

  const partiChips = PARTIER.map(p =>
    `<button type="button" data-trendparti="${p.key}" aria-pressed="${state.trendPartier.includes(p.key)}">
      <i class="key" style="--k:${p.farge}"></i>${p.navn}</button>`
  ).join("");
  const typeChips = Object.entries(VALG).map(([vk, v]) =>
    `<button type="button" data-trendtype="${vk}" aria-pressed="${state.trendTyper.includes(vk)}">${v.navn}</button>`
  ).join("");

  host.innerHTML = `
    <section class="card">
      <div class="card-head">
        <h2>Oppslutning over tid — ${regNavn}</h2>
        <span class="unit">andel av stemmene, %</span>
      </div>
      <p class="desc">Ulik prikkform skiller valgtype fra hverandre når flere overlegges samtidig
      (● kommunestyre, ▲ storting, ■ fylkesting) — farge er alltid partiet.</p>

      <div class="rail-row" style="gap:18px;margin-bottom:12px;flex-wrap:wrap">
        <select data-valgregion aria-label="Region">
          <option value="${TOTAL_KEY}"${reg === TOTAL_KEY ? " selected" : ""}>Finnmark samlet</option>
          ${REGIONS.map(r => `<option value="${r.key}"${reg === r.key ? " selected" : ""}>${r.navn}</option>`).join("")}
        </select>
        <div class="seg" role="group" aria-label="Valgtype">${typeChips}</div>
      </div>
      <div class="seg" role="group" aria-label="Partier" style="flex-wrap:wrap;margin-bottom:12px">${partiChips}</div>

      <div id="valgTrendChart"></div>
    </section>`;

  const chartHost = host.querySelector("#valgTrendChart");
  if (!series.length || !ys.length) {
    chartHost.innerHTML = `<p class="empty">Velg minst ett parti og én valgtype i kontrollraden over.</p>`;
    return;
  }
  lineChart(chartHost, {
    ind: "valgandel",
    series,
    ys,
    norm: "abs",
    valueOf: (compositeKey, year) => {
      const [parti, valgtype] = compositeKey.split("|");
      return valgAndelAggregert(valgtype, reg, year, parti);
    },
    markerShape: s => MARKER_FOR_VALGTYPE[s.valgtype] || "circle",
  });
}

/* Fristilte diagramtegnere for valganalyser: egen X/Y-utregning, ingen
   avhengighet til det delte state-objektet (year-glideren og fargeslottene
   hører til de kommune-baserte fanene og skal verken påvirke eller påvirkes
   av denne fanen). Samme visuelle språk (klasser) som lineChart()/de andre
   håndtegnede diagrammene over — bare uten hover-tooltip, som ikke trengs
   for et fast, historisk datasett. */
function vaLinjeGraf({ tittel, ar, serier, dec = 0, suffix = "", visEndelabels = true }) {
  const W = 760, H = 300, ml = 46, mr = visEndelabels ? 132 : 16, mt = 12, mb = 30;
  const iw = W - ml - mr, ih = H - mt - mb;

  const vals = serier.flatMap(s => s.data.filter(v => v != null));
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];

  const X = i => ml + (ar.length === 1 ? iw / 2 : (ar[i] - ar[0]) / (ar[ar.length - 1] - ar[0]) * iw);
  const Y = v => mt + ih - (v - y0) / (y1 - y0) * ih;

  let gridl = "";
  for (const t of ticks) {
    gridl += `<line class="gridline" x1="${ml}" x2="${ml + iw}" y1="${Y(t)}" y2="${Y(t)}"/>
      <text x="${ml - 8}" y="${Y(t) + 3.5}" text-anchor="end">${nf(t, dec)}${suffix}</text>`;
  }
  const stepX = Math.max(1, Math.ceil(ar.length / 13));
  let xlabels = "";
  ar.forEach((y, i) => {
    if (i % stepX && i !== ar.length - 1) return;
    xlabels += `<text x="${X(i)}" y="${H - 10}" text-anchor="middle">${y}</text>`;
  });

  const nullY = (y0 < 0 && y1 > 0)
    ? `<line class="gridline" x1="${ml}" x2="${ml + iw}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--axis);stroke-dasharray:3 3"/>`
    : "";

  let lines = "";
  const endLabels = [];
  for (const s of serier) {
    const pts = ar.map((_, i) => ({ i, v: s.data[i] })).filter(p => p.v != null);
    if (!pts.length) continue;
    const d = pts.map((p, k) => `${k ? "L" : "M"}${X(p.i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
    lines += `<path class="serie" d="${d}" stroke="${s.farge}"/>`;
    if (visEndelabels) {
      const last = pts[pts.length - 1];
      endLabels.push({ x: X(last.i) + 8, y: Y(last.v), navn: s.navn, farge: s.farge });
    }
  }
  const GAP = 13;
  endLabels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < endLabels.length; i++) {
    if (endLabels[i].y - endLabels[i - 1].y < GAP) endLabels[i].y = endLabels[i - 1].y + GAP;
  }
  let spill = endLabels.length ? endLabels[endLabels.length - 1].y - (mt + ih) : 0;
  if (spill > 0) for (const l of endLabels) l.y -= spill;
  spill = endLabels.length ? mt - endLabels[0].y : 0;
  if (spill > 0) for (const l of endLabels) l.y += spill;
  const labels = endLabels.map(l =>
    `<text class="endlabel" x="${l.x}" y="${l.y + 3.5}" fill="${l.farge}">${l.navn}</text>`).join("");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <title>${tittel}</title>
    ${gridl}${nullY}
    <line class="axisline" x1="${ml}" x2="${ml + iw}" y1="${mt + ih}" y2="${mt + ih}"/>
    ${xlabels}${lines}${labels}
  </svg>`;
}

/**
 * Grupperte eller stablede stolper over faste kategorier (ikke år på en
 * kontinuerlig akse — det er vaLinjeGraf sin jobb). `serier` er alltid
 * flere serier; for ett enkelt tall per kategori (f.eks. gjennomsnittlig
 * institusjonstillit) sendes én serie med `kategoriFarger` for å gi hver
 * stolpe sin egen farge i stedet for én ensfarget serie.
 */
function vaStolpeGraf({ kategorier, serier, dec = 1, suffix = "", stack = false, kategoriFarger = null, rotate = false }) {
  const W = 760, H = rotate ? 320 : 300, ml = 50, mr = 16, mt = 12, mb = rotate ? 66 : 30;
  const iw = W - ml - mr, ih = H - mt - mb;
  const n = kategorier.length;
  const slot = iw / n;
  const groupW = Math.min(slot * 0.72, 64);
  const barW = stack ? groupW : groupW / serier.length;

  const maxV = stack
    ? Math.max(...kategorier.map((_, i) => serier.reduce((s, se) => s + (se.data[i] ?? 0), 0)))
    : Math.max(...serier.flatMap(se => se.data.filter(v => v != null)));
  const ticks = niceTicks(0, maxV);
  const yMax = ticks[ticks.length - 1];
  const Y = v => mt + ih - v / yMax * ih;

  let gridl = "";
  for (const t of ticks) {
    gridl += `<line class="gridline" x1="${ml}" x2="${ml + iw}" y1="${Y(t)}" y2="${Y(t)}"/>
      <text x="${ml - 8}" y="${Y(t) + 3.5}" text-anchor="end">${nf(t, dec)}${suffix}</text>`;
  }

  let bars = "", xlabels = "";
  kategorier.forEach((kat, i) => {
    const cx = ml + (i + 0.5) * slot;
    if (stack) {
      let acc = 0;
      for (const se of serier) {
        const v = se.data[i] ?? 0;
        if (!v) continue;
        const y0r = Y(acc + v), h = Math.max(0, Y(acc) - Y(acc + v) - 1);
        const farge = kategoriFarger ? kategoriFarger[i] : se.farge;
        bars += `<rect x="${(cx - groupW / 2).toFixed(1)}" y="${y0r.toFixed(1)}" width="${groupW.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${farge}"><title>${se.navn} — ${kat}: ${nf(v, dec)}${suffix}</title></rect>`;
        acc += v;
      }
    } else {
      serier.forEach((se, si) => {
        const v = se.data[i];
        if (v == null) return;
        const x = cx - groupW / 2 + si * barW;
        const y0r = Y(v);
        const farge = kategoriFarger ? kategoriFarger[i] : se.farge;
        bars += `<rect x="${x.toFixed(1)}" y="${y0r.toFixed(1)}" width="${Math.max(1, barW - 3).toFixed(1)}" height="${(mt + ih - y0r).toFixed(1)}" rx="1.5" fill="${farge}"><title>${se.navn} — ${kat}: ${nf(v, dec)}${suffix}</title></rect>`;
      });
    }
    const tf = rotate ? ` transform="rotate(-38 ${cx.toFixed(1)} ${H - mb + 12})"` : "";
    const anchor = rotate ? "end" : "middle";
    xlabels += `<text x="${cx.toFixed(1)}" y="${H - mb + 12}" text-anchor="${anchor}"${tf}>${kat}</text>`;
  });

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    ${gridl}
    <line class="axisline" x1="${ml}" x2="${ml + iw}" y1="${mt + ih}" y2="${mt + ih}"/>
    ${bars}${xlabels}
  </svg>`;
}

/** Vannrett 100%-stolpe for én enkelt sammensetning (velgervandring). */
function vaStolpe100(segmenter) {
  const W = 760, H = 34;
  let x = 0, rects = "", labels = "";
  for (const s of segmenter) {
    const w = s.verdi / 100 * W;
    rects += `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="26" fill="${s.farge}"><title>${s.navn}: ${nf(s.verdi, 0)} %</title></rect>`;
    if (s.verdi >= 6) {
      labels += `<text class="seglabel" x="${(x + w / 2).toFixed(1)}" y="17" text-anchor="middle">${nf(s.verdi, 0)} %</text>`;
    }
    x += w;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" style="height:${H}px">${rects}${labels}</svg>`;
}
