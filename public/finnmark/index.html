function renderSammen(host) {
  const xi = state.scatterX, yi = state.scatterY, yr = state.scatterYear;
  const pts = REGIONS.map(r => ({
    key: r.key, navn: r.navn,
    x: raw(r.key, yr, xi), y: raw(r.key, yr, yi), pop: popOf(r.key, yr),
  })).filter(p => p.x != null && p.y != null);

  const W = 760, H = 400, ml = 62, mr = 20, mt = 14, mb = 46;
  const iw = W - ml - mr, ih = H - mt - mb;

  const xt = niceTicks(Math.min(...pts.map(p => p.x)), Math.max(...pts.map(p => p.x)), 5);
  const yt = niceTicks(Math.min(...pts.map(p => p.y)), Math.max(...pts.map(p => p.y)), 5);
  const X = v => ml + (v - xt[0]) / (xt[xt.length - 1] - xt[0]) * iw;
  const Y = v => mt + ih - (v - yt[0]) / (yt[yt.length - 1] - yt[0]) * ih;
  const maxPop = Math.max(...pts.map(p => p.pop || 1));
  const R = p => 4 + Math.sqrt((p.pop || 1) / maxPop) * 9;

  let g = "";
  for (const t of yt) g += `<line class="gridline" x1="${ml}" x2="${ml + iw}" y1="${Y(t)}" y2="${Y(t)}"/>
                            <text x="${ml - 8}" y="${Y(t) + 3.5}" text-anchor="end">${nf(t, IND[yi].dec)}</text>`;
  for (const t of xt) g += `<line class="gridline" x1="${X(t)}" x2="${X(t)}" y1="${mt}" y2="${mt + ih}"/>
                            <text x="${X(t)}" y="${mt + ih + 16}" text-anchor="middle">${nf(t, IND[xi].dec)}</text>`;

  /* Etikettplassering: alle 18 navn skal stå, så de som kolliderer skyves
     nedover, og de som ville gått ut over høyre ramme snus til venstre side. */
  const lab = pts.map(p => {
    const w = p.navn.length * 5.7;
    const right = X(p.x) + R(p) + 5;
    const flip = right + w > ml + iw;
    return { p, w, ly: Y(p.y) + 3.5, lx: flip ? X(p.x) - R(p) - 5 : right, anchor: flip ? "end" : "start" };
  }).sort((a, b) => a.ly - b.ly);

  const box = L => L.anchor === "end" ? [L.lx - L.w, L.lx] : [L.lx, L.lx + L.w];
  const done = [];
  for (const L of lab) {
    let guard = 0;
    while (guard++ < 30) {
      const [l0, l1] = box(L);
      const clash = done.some(q => {
        const [q0, q1] = box(q);
        return Math.abs(q.ly - L.ly) < 11 && l0 < q1 && q0 < l1;
      });
      if (!clash) break;
      L.ly += 11;
    }
    done.push(L);
  }

  const marks = pts.map(p =>
    `<circle class="scatter-pt" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${R(p).toFixed(1)}"
       fill="var(--s1)" fill-opacity="0.72"><title>${p.navn} (${yr})
${IND[xi].navn}: ${nf(p.x, IND[xi].dec)} ${IND[xi].enhet}
${IND[yi].navn}: ${nf(p.y, IND[yi].dec)} ${IND[yi].enhet}
Folkemengde: ${nf(p.pop, 0)}</title></circle>`
  ).join("") + lab.map(L =>
    `<text class="ptlabel" x="${L.lx.toFixed(1)}" y="${L.ly.toFixed(1)}" text-anchor="${L.anchor}">${L.p.navn}</text>`
  ).join("");

  const opts = ind => Object.entries(IND)
    .map(([k, m]) => `<option value="${k}"${k === ind ? " selected" : ""}>${m.navn}</option>`).join("");

  const tbl = `<div class="table-scroll"><table>
    <thead><tr><th>Kommune</th><th>${IND[xi].navn}</th><th>${IND[yi].navn}</th><th>Folkemengde</th><th>Kilde</th></tr></thead>
    <tbody>${pts.slice().sort((a, b) => b.x - a.x).map(p =>
      `<tr><td>${p.navn}</td><td>${nf(p.x, IND[xi].dec)}</td><td>${nf(p.y, IND[yi].dec)}</td>
       <td>${nf(p.pop, 0)}</td><td><span class="pill">${IND[xi].kilde} · ${IND[yi].kilde}</span></td></tr>`).join("")}
    </tbody></table></div>`;

  host.innerHTML = `
    <section class="card">
      <div class="card-head">
        <h2>${IND[yi].navn} mot ${IND[xi].navn}</h2>
        <span class="unit">ett punkt per kommune · ${yr}</span>
      </div>
      <p class="desc">Alle kommuner vises alltid her — poenget er å se mønsteret på tvers, ikke
      utvalget fra kontrollraden. Punktstørrelsen er folkemengde, så små kommuner
      med ekstreme forholdstall ikke leses som hovedfunn.</p>

      <div class="rail-row" style="gap:18px;margin-bottom:14px">
        <div class="field"><span class="field-label">Vannrett akse</span>
          <select data-axis="scatterX" aria-label="Indikator vannrett akse">${opts(xi)}</select></div>
        <div class="field"><span class="field-label">Loddrett akse</span>
          <select data-axis="scatterY" aria-label="Indikator loddrett akse">${opts(yi)}</select></div>
        <div class="field"><span class="field-label">År</span>
          <select data-axis="scatterYear" aria-label="År">
            ${years().map(y => `<option value="${y}"${y === yr ? " selected" : ""}>${y}</option>`).join("")}
          </select></div>
      </div>

      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
        <title>${IND[yi].navn} mot ${IND[xi].navn} per kommune i ${yr}</title>
        ${g}${marks}
        <line class="axisline" x1="${ml}" x2="${ml + iw}" y1="${mt + ih}" y2="${mt + ih}"/>
        <line class="axisline" x1="${ml}" x2="${ml}" y1="${mt}" y2="${mt + ih}"/>
        <text x="${ml + iw / 2}" y="${H - 8}" text-anchor="middle" style="fill:var(--ink-2)">${IND[xi].navn} (${IND[xi].enhet})</text>
        <text x="14" y="${mt + ih / 2}" text-anchor="middle" transform="rotate(-90 14 ${mt + ih / 2})"
          style="fill:var(--ink-2)">${IND[yi].navn} (${IND[yi].enhet})</text>
      </svg>

      <div class="source"><span>Kilder: ${kildeHTML(`${IND[xi].kilde} · ${IND[yi].kilde}`)}</span><span>Hentet: ${hentet(xi)} · ${hentet(yi)}</span></div>
      <details class="tableview"><summary>Vis tallene i tabell</summary>${tbl}</details>
    </section>`;
}

// Fanen fjernes helt hvis den er slått av, ikke bare skjules med en melding.
// Standardfanen er "befolkning", så det trengs ingen fallback her.
const TABS_SYNLIG = VIS_KOMMUNEOKONOMI ? TABS : TABS.filter((t) => t.id !== "okonomi");

function stateFromUrl() {
  const p = new URLSearchParams(window.location.search);
  const allowedTabs = new Set(TABS_SYNLIG.map(t => t.id));
  const validRegions = new Set(REGIONS.map(r => r.key));
  const validAges = new Set(AGE_BANDS.map(b => b.key));
  const validReferences = new Set(AGE_REFERENCES.map(r => r.key));
  const readList = (key, allowed) => p.has(key)
    ? p.get(key).split(",").filter(v => allowed.has(v))
    : null;
  const regions = readList("regions", validRegions);
  const ages = readList("ages", validAges);
  const references = readList("references", validReferences);

  if (p.has("tab") && allowedTabs.has(p.get("tab"))) state.tab = p.get("tab");
  if (regions) state.selected = regions;
  else if (p.has("regions")) state.selected = [];
  if (p.has("total")) state.showTotal = p.get("total") === "1";
  if (p.has("from")) state.from = Number(p.get("from"));
  if (p.has("to")) state.to = Number(p.get("to"));
  if (p.has("allYears")) state.visAlleAr = p.get("allYears") === "1";
  if (p.has("norm") && ["abs", "per1000", "index"].includes(p.get("norm"))) state.norm = p.get("norm");
  if (p.has("befView") && ["tidsserie", "struktur"].includes(p.get("befView"))) state.befView = p.get("befView");
  if (ages) state.ageBands = ages;
  else if (p.has("ages")) state.ageBands = [];
  if (references) state.ageReferences = references.slice(0, 2);
  else if (p.has("references")) state.ageReferences = [];
  if (p.has("pyrRegion") && (p.get("pyrRegion") === TOTAL_KEY || validRegions.has(p.get("pyrRegion")))) state.pyrRegion = p.get("pyrRegion");
  if (p.has("pyrMode") && ["antall", "prosent"].includes(p.get("pyrMode"))) state.pyrMode = p.get("pyrMode");
  if (p.has("valgtype")) state.valgtype = p.get("valgtype");
  if (p.has("valgRegion") && (p.get("valgRegion") === TOTAL_KEY || validRegions.has(p.get("valgRegion")))) state.valgRegion = p.get("valgRegion");
  if (p.has("valgVisning")) state.valgVisning = p.get("valgVisning");
  if (p.has("hemiValgtype")) state.hemiValgtype = p.get("hemiValgtype");
  if (p.has("hemiYear") && Number.isFinite(Number(p.get("hemiYear")))) state.hemiYear = Number(p.get("hemiYear"));
  if (p.has("trendPartier")) state.trendPartier = p.get("trendPartier").split(",").filter(Boolean);
  if (p.has("trendTyper")) state.trendTyper = p.get("trendTyper").split(",").filter(Boolean);
  if (p.has("scatterX")) state.scatterX = p.get("scatterX");
  if (p.has("scatterY")) state.scatterY = p.get("scatterY");
  if (p.has("scatterYear") && Number.isFinite(Number(p.get("scatterYear")))) state.scatterYear = Number(p.get("scatterYear"));
  for (const tema of Object.keys(state.ind)) {
    const key = `ind_${tema}`;
    if (p.has(key) && IND[p.get(key)]) state.ind[tema] = p.get(key);
  }
}

function shareUrl() {
  const p = new URLSearchParams();
  const put = (key, value) => {
    if (value !== undefined && value !== null && value !== "") p.set(key, String(value));
  };
  put("tab", state.tab);
  put("regions", state.selected.join(","));
  if (state.showTotal) put("total", "1");
  put("from", state.from);
  put("to", state.to);
  if (state.visAlleAr) put("allYears", "1");
  put("norm", state.norm);
  put("befView", state.befView);
  put("ages", state.ageBands.join(","));
  put("references", state.ageReferences.join(","));
  put("pyrRegion", state.pyrRegion);
  put("pyrMode", state.pyrMode);
  for (const tema of Object.keys(state.ind)) put(`ind_${tema}`, state.ind[tema]);
  put("valgtype", state.valgtype);
  put("valgRegion", state.valgRegion);
  put("valgVisning", state.valgVisning);
  put("hemiValgtype", state.hemiValgtype);
  put("hemiYear", state.hemiYear);
  put("trendPartier", state.trendPartier.join(","));
  put("trendTyper", state.trendTyper.join(","));
  put("scatterX", state.scatterX);
  put("scatterY", state.scatterY);
  put("scatterYear", state.scatterYear);
  const url = new URL(window.location.href);
  url.search = p.toString();
  url.hash = "";
  return url.toString();
}

function syncShareUrl() {
  window.history.replaceState(null, "", shareUrl());
}

async function copyShareUrl() {
  const status = document.getElementById("shareStatus");
  const link = shareUrl();
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(link);
    } else {
      const input = document.createElement("textarea");
      input.value = link;
      input.setAttribute("readonly", "");
      input.style.position = "fixed";
      input.style.opacity = "0";
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      input.remove();
    }
    status.textContent = "Lenken er kopiert.";
  } catch {
    status.textContent = "Kopieringen ble blokkert. Kopier lenken fra adressefeltet.";
  }
  window.setTimeout(() => { status.textContent = ""; }, 4000);
}

tabsEl.innerHTML = TABS_SYNLIG.map(t =>
  `<button role="tab" type="button" data-tab="${t.id}" aria-selected="${t.id === state.tab}">${t.navn}</button>`
).join("");
mainEl.innerHTML = TABS_SYNLIG.map(t => `<div class="panel" data-panel="${t.id}" role="tabpanel"></div>`).join("");

function renderChips() {
  const host = document.getElementById("regionChips");
  const atCap = state.selected.length >= MAX_SERIES;
  host.innerHTML =
    `<button class="chip is-total" type="button" data-total aria-pressed="${state.showTotal}">
       <i class="swatch"></i>Finnmark samlet</button>` +
    REGIONS.map(r => {
      const on = state.selected.includes(r.key);
      return `<button class="chip" type="button" data-region="${r.key}" aria-pressed="${on}"
        ${!on && atCap ? "disabled" : ""} style="--sw:${on ? colorOf(r.key) : "transparent"}"
        title="${r.navn} · ${r.sami} · SSB ${r.ssb2024}">
        <i class="swatch"></i>${r.navn}</button>`;
    }).join("");

  document.getElementById("capNote").textContent = atCap
    ? `Grensen på ${MAX_SERIES} kommuner er nådd. Fjern én for å legge til en annen — flere enn åtte linjer kan ikke skilles pålitelig med farge alene.`
    : `${state.selected.length} av maks ${MAX_SERIES} kommuner valgt. Sammenstillingsfanen viser alltid alle 18.`;
}

function renderNormNote() {
  const tema = state.tab;
  const note = document.getElementById("normNote");
  const seg = document.getElementById("normSeg");
  const ind = state.ind[tema];
  const applicable = tema in state.ind ? per1000Allowed(ind) : true;

  seg.querySelectorAll("button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.norm === state.norm));
    if (b.dataset.norm === "per1000") b.disabled = (tema in state.ind) && !applicable;
  });

  if (!(tema in state.ind)) { note.textContent = "Måleform gjelder de tre tidsseriefanene."; return; }
  if (state.norm === "per1000" && !applicable) {
    note.textContent = `${IND[ind].navn} er allerede et forholdstall — vises absolutt.`;
  } else if (state.norm === "index") {
    note.textContent = `${state.from} = 100 for hver region.`;
  } else {
    note.textContent = "";
  }
}

function render() {
  assignSlots();
  assignAgeSlots();
  renderChips();

  tabsEl.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  mainEl.querySelectorAll(".panel").forEach(p => {
    if (p.dataset.panel === state.tab) p.setAttribute("data-active", ""); else p.removeAttribute("data-active");
  });

  renderNormNote();

  const host = mainEl.querySelector(`[data-panel="${state.tab}"]`);
  if (state.tab === "valg") renderValg(host);
  else if (state.tab === "valganalyser") renderValganalyser(host);
  else if (state.tab === "sammen") renderSammen(host);
  else if (state.tab === "befolkning" && state.befView === "struktur") renderPyramid(host);
  else renderThemePanel(state.tab, host);
  syncShareUrl();
}

/* Hendelser — én delegert lytter for hele siden. */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button");
  if (!t) return;

  if (t.id === "copyShareLink") { copyShareUrl(); }
  else if (t.dataset.tab) { state.tab = t.dataset.tab; render(); }
  else if (t.dataset.region) {
    const k = t.dataset.region;
    state.selected = state.selected.includes(k)
      ? state.selected.filter(x => x !== k)
      : (state.selected.length < MAX_SERIES ? [...state.selected, k] : state.selected);
    render();
  }
  else if (t.hasAttribute("data-total")) { state.showTotal = !state.showTotal; render(); }
  else if (t.dataset.norm) { state.norm = t.dataset.norm; render(); }
  else if (t.dataset.setnorm) { state.norm = t.dataset.setnorm; render(); }
  else if (t.dataset.valgtype) { state.valgtype = t.dataset.valgtype; render(); }
  else if (t.dataset.valgvisning) { state.valgVisning = t.dataset.valgvisning; render(); }
  else if (t.dataset.hemivalgtype) {
    state.hemiValgtype = t.dataset.hemivalgtype;
    const ar = VALG[state.hemiValgtype].ar;
    if (!ar.includes(state.hemiYear)) state.hemiYear = ar[ar.length - 1];
    render();
  }
  else if (t.dataset.trendparti) {
    const k = t.dataset.trendparti;
    state.trendPartier = state.trendPartier.includes(k)
      ? state.trendPartier.filter(x => x !== k)
      : [...state.trendPartier, k];
    render();
  }
  else if (t.dataset.trendtype) {
    const k = t.dataset.trendtype;
    state.trendTyper = state.trendTyper.includes(k)
      ? state.trendTyper.filter(x => x !== k)
      : [...state.trendTyper, k];
    render();
  }
  else if (t.dataset.befview) { state.befView = t.dataset.befview; render(); }
  else if (t.dataset.pyrmode) { state.pyrMode = t.dataset.pyrmode; render(); }
  else if (t.dataset.ageband) {
    const k = t.dataset.ageband;
    if (state.ageBands.includes(k)) state.ageBands = state.ageBands.filter(x => x !== k);
    else if (state.ageBands.length < MAX_SERIES) state.ageBands = [...state.ageBands, k];
    render();
  }
  else if (t.dataset.ageref) {
    const key = t.dataset.ageref;
    if (state.ageReferences.includes(key)) state.ageReferences = state.ageReferences.filter(x => x !== key);
    else if (state.ageReferences.length < 2) state.ageReferences = [...state.ageReferences, key];
    render();
  }
  else if (t.dataset.agepick) {
    const pick = AGE_PICKS[t.dataset.agepick];
    state.ageBands = pick
      ? AGE_BANDS.filter(b => b.lo >= pick.lo && b.lo <= pick.hi).map(b => b.key).slice(0, MAX_SERIES)
      : [];
    render();
  }
  else if (t.id === "clearAll") { state.selected = []; render(); }
  else if (t.id === "pickAll") {
    // Bevisst valg: viser alle 18, selv om det er flere enn de 8 fargeslotsene
    // kan skille pålitelig — cap-notatet forklarer hvorfor noen deler farge.
    state.selected = REGIONS.map(r => r.key);
    render();
  }
});

document.addEventListener("change", ev => {
  const s = ev.target;
  if (s.dataset.indpicker) { state.ind[s.dataset.indpicker] = s.value; render(); }
  else if (s.dataset.valgregion !== undefined) { state.valgRegion = s.value; render(); }
  else if (s.dataset.hemiyear !== undefined) { state.hemiYear = +s.value; render(); }
  else if (s.dataset.pyrregion !== undefined) { state.pyrRegion = s.value; render(); }
  else if (s.dataset.axis) {
    state[s.dataset.axis] = s.dataset.axis === "scatterYear" ? +s.value : s.value;
    render();
  }
});

const yFrom = document.getElementById("yearFrom");
const yTo = document.getElementById("yearTo");
const yFromNum = document.getElementById("yrFrom");
const yToNum = document.getElementById("yrTo");
const visAlleArBox = document.getElementById("visAlleAr");

/* Med ekte data begrenses velgeren til årene uttrekket faktisk dekker. Å la
   brukeren dra til 2000 når SSB-uttrekket starter i 2015 ville produsert en
   tom venstrehalvdel som ser ut som befolkningskollaps. */
const [SPENN_MIN, SPENN_MAX] = EKTE_ÅR.length
  ? [EKTE_ÅR[0], EKTE_ÅR[EKTE_ÅR.length - 1]]
  : [YEAR_MIN, YEAR_MAX];
state.from = Math.min(Math.max(state.from, SPENN_MIN), SPENN_MAX - 1);
state.to   = Math.min(Math.max(state.to, state.from + 1), SPENN_MAX);
if (state.scatterYear < state.from || state.scatterYear > state.to) state.scatterYear = state.to;

stateFromUrl();
state.from = Math.min(Math.max(Number.isFinite(state.from) ? state.from : SPENN_MIN, SPENN_MIN), SPENN_MAX - 1);
state.to = Math.min(Math.max(Number.isFinite(state.to) ? state.to : SPENN_MAX, state.from + 1), SPENN_MAX);
if (state.scatterYear < state.from || state.scatterYear > state.to) state.scatterYear = state.to;

yFrom.min = yTo.min = yFromNum.min = yToNum.min = SPENN_MIN;
yFrom.max = yTo.max = yFromNum.max = yToNum.max = SPENN_MAX;

function settYearKontroller(a, b) {
  yFrom.value = a; yTo.value = b; yFromNum.value = a; yToNum.value = b;
}
settYearKontroller(state.from, state.to);

/* Både glidere og skriv-inn-feltene kaller denne — «which» sier hvilken
   ende som nettopp ble endret, resten avledes fra state slik den var. */
function applyYear(which, raw) {
  let v = Math.round(raw);
  if (Number.isNaN(v)) v = which === "from" ? state.from : state.to;
  v = Math.min(Math.max(v, SPENN_MIN), SPENN_MAX);
  let a = which === "from" ? v : state.from;
  let b = which === "to" ? v : state.to;
  if (a > b - 1) { if (which === "from") a = b - 1; else b = a + 1; }
  a = Math.max(a, SPENN_MIN); b = Math.min(b, SPENN_MAX);
  state.from = a; state.to = b;
  if (state.scatterYear < a || state.scatterYear > b) state.scatterYear = b;
  settYearKontroller(a, b);
  render();
}
yFrom.addEventListener("input", () => applyYear("from", +yFrom.value));
yTo.addEventListener("input", () => applyYear("to", +yTo.value));
yFromNum.addEventListener("change", () => applyYear("from", +yFromNum.value));
yToNum.addEventListener("change", () => applyYear("to", +yToNum.value));

visAlleArBox.checked = state.visAlleAr;
visAlleArBox.addEventListener("change", () => { state.visAlleAr = visAlleArBox.checked; render(); });

;

render();
}

start();
</script>
